name: Bazel CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Run tests
        run: |
          bazel test //... --config=ci --config=release --config=ci-test --config=ci-presubmit --keep_going \
            --remote_header="x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" \
            --execution_log_compact_file="$RUNNER_TEMP/presubmit.exec.zst"

  database-image:
    name: Validate multiarchitecture database image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Validate AMD64, ARM64, and image attestations
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          bazel test //database/tests:image_test --config=ci --config=release --config=ci-push --keep_going \
            --remote_header="x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" \
            --execution_log_compact_file="$RUNNER_TEMP/database-image.exec.zst"

  publish:
    name: Publish images
    needs: [test, database-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          bazel run //:push --config=ci --config=release --config=ci-push \
            --remote_header="x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Generate coverage
        run: |
          bazel coverage //... \
            --config=ci \
            --remote_header="x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" \
            --config=ci-test \
            --config=ci-coverage \
            --combined_report=lcov \
            --instrumentation_filter=//... \
            --instrument_test_targets

      - name: Debug coverage files
        run: |
          echo "Coverage files:"
          find bazel-out -name "*coverage*" -type f || true
          echo "First lines of report:"
          head -100 bazel-out/_coverage/_coverage_report.dat || true

      - name: Compute coverage
        id: coverage
        run: |
          REPORT="bazel-out/_coverage/_coverage_report.dat"

          if [ ! -f "$REPORT" ]; then
            echo "coverage=0" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          LINES_FOUND=$(grep -c '^DA:' "$REPORT" || echo 0)
          LINES_HIT=$(awk -F',' '/^DA:/ {if ($2 > 0) hit++} END {print hit + 0}' "$REPORT")

          PERCENT=$(awk \
            "BEGIN {
              if ($LINES_FOUND > 0)
                printf \"%.2f\", ($LINES_HIT/$LINES_FOUND)*100;
              else
                print 0
            }"
          )

          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"

          cat <<EOF > coverage.md
          ## 📊 Coverage Report
          | Metric | Value |
          |---|---|
          | Lines covered | $LINES_HIT |
          | Lines total | $LINES_FOUND |
          | Coverage | $PERCENT % |
          EOF
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: bazel-coverage
          path: coverage.md
