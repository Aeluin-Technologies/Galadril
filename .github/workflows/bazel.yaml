name: Bazel CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      BAZEL_FLAGS: >-
        --config=ci
        --config=release
        --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Validate authorization contract
        run: python3 schemas/spicedb/validate_contract.py

      - name: Run tests
        run: bazel test //... $BAZEL_FLAGS

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: bazel run //:push $BAZEL_FLAGS

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      BAZEL_FLAGS: >-
        --config=ci
        --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Generate coverage
        run: |
          bazel coverage //... \
            $BAZEL_FLAGS \
            --nocache_test_results \
            --combined_report=lcov \
            --instrumentation_filter=//... \
            --instrument_test_targets

      - name: Debug coverage files
        run: |
          echo "Coverage files:"
          find bazel-out -name "*coverage*" -type f || true
          echo "First lines of report:"
          head -100 bazel-out/_coverage/_coverage_report.dat || true

      - name: Compute coverage
        id: coverage
        run: |
          REPORT="bazel-out/_coverage/_coverage_report.dat"

          if [ ! -f "$REPORT" ]; then
            echo "coverage=0" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          LINES_FOUND=$(grep -c '^DA:' "$REPORT" || echo 0)
          LINES_HIT=$(awk -F',' '/^DA:/ {if ($2 > 0) hit++} END {print hit + 0}' "$REPORT")

          PERCENT=$(awk \
            "BEGIN {
              if ($LINES_FOUND > 0)
                printf \"%.2f\", ($LINES_HIT/$LINES_FOUND)*100;
              else
                print 0
            }"
          )

          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"

          cat <<EOF > coverage.md
          ## 📊 Coverage Report
          | Metric | Value |
          |---|---|
          | Lines covered | $LINES_HIT |
          | Lines total | $LINES_FOUND |
          | Coverage | $PERCENT % |
          EOF
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bazel-coverage
          path: coverage.md
