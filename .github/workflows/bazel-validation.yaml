name: Bazel integration validation

on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:
    inputs:
      workload:
        description: Workload
        type: choice
        options:
          - integration
          - benchmark
        default: integration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    name: ${{ inputs.workload == 'benchmark' && 'Lifecycle benchmark' || 'Full integration suite' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BAZEL_FLAGS: >-
        --config=ci
        --config=release
        --config=ci-test
        --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Run integration tests without result reuse
        if: inputs.workload != 'benchmark'
        run: |
          bazel test //... $BAZEL_FLAGS --config=ci-validation --keep_going \
            --execution_log_compact_file="$RUNNER_TEMP/integration.exec.zst"

      - name: Run the complete lifecycle benchmark
        if: inputs.workload == 'benchmark'
        run: |
          bazel test //tests/e2e:pipeline_lifecycle_benchmark $BAZEL_FLAGS --config=ci-benchmark \
            --execution_log_compact_file="$RUNNER_TEMP/benchmark.exec.zst"
