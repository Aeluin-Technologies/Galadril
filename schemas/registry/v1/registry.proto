syntax = "proto3";

package galadril.registry.v1;

// Registry owns ontology and pipeline persistence and semantic validation.
service Registry {
  // Internal workload discovery; never exposed to browser or Gateway callers.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // Validates only supplied tenants; an empty set is invalid.
  rpc ValidateTenants(ValidateTenantsRequest)
      returns (ValidateTenantsResponse);
  // Reads one initialized tenant without exposing storage coordinates.
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  // Idempotently initializes the tenant's S3 and lakeFS state.
  rpc PutTenant(PutTenantRequest) returns (Tenant);
  // Permanently purges all Registry data for one tenant for GDPR compliance.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);

  rpc PutPipeline(PutPipelineRequest) returns (Pipeline);
  rpc GetPipeline(GetPipelineRequest) returns (Pipeline);
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);
  rpc PublishPipeline(PublishPipelineRequest) returns (Pipeline);
  rpc DeletePipeline(DeletePipelineRequest) returns (DeletePipelineResponse);
  rpc ListPublishedPipelines(ListPublishedPipelinesRequest)
      returns (ListPipelinesResponse);
  rpc GetRuntimePipeline(GetRuntimePipelineRequest) returns (Pipeline);

  rpc SaveGolOntology(SaveGolOntologyRequest) returns (GolWorkspace);
  rpc GetGolWorkspace(GetGolWorkspaceRequest) returns (GolWorkspace);
  // Syntax-only import planning; only Gateway may approve source owners.
  rpc PreviewGolDependencies(PreviewGolDependenciesRequest) returns (GolDependencyPreview);
  rpc ValidateGolOntology(ValidateGolOntologyRequest) returns (GolValidation);
  rpc PublishGolOntology(PublishGolOntologyRequest) returns (GolPublication);
  rpc DeleteGolOntology(DeleteGolOntologyRequest) returns (DeleteGolOntologyResponse);
  rpc ListGolOntologies(ListGolOntologiesRequest) returns (ListGolOntologiesResponse);
  rpc PutBinding(PutBindingRequest) returns (GolBinding);
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  // Trusted runtime mapping only; metadata disclosure is gated by Gateway.
  rpc GetGolBinding(GetGolBindingRequest) returns (GolBinding);
}

message Tenant {
  string tenant_id = 1;
  string head_revision_id = 2;
}

message ListTenantsRequest {
  uint32 limit = 1;
  optional string page_token = 2;
}

message ListTenantsResponse {
  repeated string tenant_ids = 1;
  optional string next_page_token = 2;
}

message TenantValidation {
  string tenant_id = 1;
  bool exists = 2;
}

message ValidateTenantsRequest { repeated string tenant_ids = 1; }

message ValidateTenantsResponse {
  repeated TenantValidation tenants = 1;
}

message GetTenantRequest { string tenant_id = 1; }

message PutTenantRequest { string tenant_id = 1; }

message DeleteTenantRequest {
  string tenant_id = 1;
  // Must exactly match tenant_id to guard the irreversible GDPR purge.
  string confirmation_tenant_id = 2;
}

message DeleteTenantResponse {}

message Pipeline {
  string pipeline_id = 1;
  string name = 2;
  string owner_id = 3;
  string head_revision_id = 4;
  optional string published_revision_id = 5;
  bytes definition_json = 6;
  string author_id = 7;
  string message = 8;
  int64 created_at_ms = 9;
  int64 updated_at_ms = 10;
  optional int64 deleted_at_ms = 11;
  optional string previous_revision_id = 12;
  // Versioned collaboration state, independent from execution configuration.
  bytes authoring_json = 13;
}

message PutPipelineRequest {
  string tenant_id = 1;
  string pipeline_id = 2;
  string name = 3;
  string owner_id = 4;
  bytes definition_json = 5;
  string author_id = 6;
  string message = 7;
  optional string expected_revision_id = 8;
  bool create_only = 9;
  // A strictly typed AuthoringCommand; absent retains the legacy strict write.
  optional bytes authoring_command_json = 10;
}

message GetPipelineRequest {
  string tenant_id = 1;
  string pipeline_id = 2;
  optional string revision_id = 3;
}

message ListPipelinesRequest {
  string tenant_id = 1;
  uint32 limit = 2;
}

message ListPublishedPipelinesRequest {
  string tenant_id = 1;
  uint32 limit = 2;
}

message ListPipelinesResponse { repeated Pipeline pipelines = 1; }

message PublishPipelineRequest {
  string tenant_id = 1;
  string pipeline_id = 2;
  string revision_id = 3;
}

message DeletePipelineRequest {
  string tenant_id = 1;
  string pipeline_id = 2;
  string expected_revision_id = 3;
}

message DeletePipelineResponse { string revision_id = 1; }

message GetRuntimePipelineRequest {
  string tenant_id = 1;
  string pipeline_id = 2;
  string revision_id = 3;
}

// Source contents are available only through source-authoring permissions.
message GolFile { string path = 1; string text = 2; }
message GolDiagnostic {
  string code = 1;
  string message = 2;
  string path = 3;
  uint64 start = 4;
  uint64 end = 5;
  string severity = 6;
}
message GolDependency {
  string ontology_id = 1;
  string generation = 2;
  string source_revision = 3;
}
message GolPackageOrigin {
  string plugin_id = 1;
  string plugin_version = 2;
  string package_version = 3;
}
message GolSummary {
  string ontology_id = 1;
  string display_name = 2;
  string source_revision = 3;
  optional string active_generation = 4;
  optional string active_source_revision = 5;
  string status = 6;
  GolPackageOrigin origin = 7;
}
message GolWorkspace {
  GolSummary summary = 1;
  repeated GolFile files = 2;
  repeated GolDiagnostic diagnostics = 3;
  repeated GolDependency dependencies = 4;
}
message GolValidation {
  string ontology_id = 1;
  string source_revision = 2;
  string status = 3;
  repeated GolDiagnostic diagnostics = 4;
  repeated GolDependency dependencies = 5;
}
message GolPublication {
  string ontology_id = 1;
  string source_revision = 2;
  string generation = 3;
}
message SaveGolOntologyRequest {
  string tenant_id = 1;
  string ontology_id = 2;
  string display_name = 3;
  repeated GolFile files = 4;
  string author = 5;
  optional string expected_revision = 6;
  // Populated only by Gateway from the deployed inventory.
  GolPackageOrigin origin = 7;
}
message GetGolWorkspaceRequest {
  string tenant_id = 1;
  string ontology_id = 2;
  optional string source_revision = 3;
}
message ValidateGolOntologyRequest {
  string tenant_id = 1;
  string ontology_id = 2;
  string source_revision = 3;
  string plan_pin = 4;
  repeated string approved_owners = 5;
}
message PublishGolOntologyRequest {
  string tenant_id = 1;
  string ontology_id = 2;
  string source_revision = 3;
  optional string expected_generation = 4;
  // Authenticated actor supplied only by Gateway, never browser input.
  string author_id = 5;
  string plan_pin = 6;
  repeated string approved_owners = 7;
}
message PreviewGolDependenciesRequest {
  string tenant_id = 1;
  string ontology_id = 2;
  string source_revision = 3;
  repeated string approved_owners = 4;
}
message GolDependencyPreview {
  repeated string required_owners = 1;
  optional string plan_pin = 2;
  repeated GolDependency dependencies = 3;
}
message DeleteGolOntologyRequest {
  string tenant_id = 1;
  string ontology_id = 2;
  string expected_revision = 3;
  string author = 4;
}
message DeleteGolOntologyResponse { string revision = 1; }
message ListGolOntologiesRequest { string tenant_id = 1; uint32 limit = 2; }
message ListGolOntologiesResponse { repeated GolSummary ontologies = 1; }

// Generation and source pins are captured atomically with pipeline authoring.
message GolBinding {
  string pipeline_id = 1;
  string block_id = 2;
  string ontology_id = 3;
  string generation = 4;
  string source_revision = 5;
  repeated string symbols = 6;
  int64 updated_at_ms = 7;
  string head_revision_id = 8;
}
message PutBindingRequest {
  string tenant_id = 1;
  GolBinding binding = 2;
  string expected_revision_id = 3;
}
message ListBindingsRequest {
  string tenant_id = 1;
  optional string pipeline_id = 2;
  uint32 limit = 3;
  optional string revision_id = 4;
}
message ListBindingsResponse { repeated GolBinding bindings = 1; }
message GetGolBindingRequest {
  string tenant_id = 1;
  // The execution root and exact deployed revision select the composition.
  string pipeline_id = 2;
  string pipeline_revision_id = 3;
  // A step ID from the compiled composition, including generated IDs.
  string block_id = 4;
}
