[package]
name = "intake"
version = "0.1.1"
edition = "2024"

[dependencies]
aws-config = { version = "1.10", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.141"
rdkafka = { version = "0.39", features = ["tokio"] }
schema_registry_converter = { version = "4.10", features = ["avro", "blocking"] }
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = "1"
apache-avro = { version = "0.21", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["v4", "v5"] }
anyhow = { workspace = true }
csv = "1.4"
regex = "1"
tracing = "0.1"
tracing-opentelemetry = "0.32"
galadril-telemetry.workspace = true
opentelemetry = "0.31"
urlencoding = "2"
sanitize-filename = "0.6"
config = { version = "0.15", features = ["yaml"] }
bytes = "1.12"
moka = { version = "0.12", features = ["future"] }
mimalloc = { workspace = true }

[dev-dependencies]
mockall = "0.15"
opentelemetry_sdk = "0.31"
