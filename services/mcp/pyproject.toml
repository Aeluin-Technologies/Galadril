[project]
name = "galadril-mcp-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["galadril-mcp-core", "galadril-plugins", "httpx>=0.28.1", "mcp>=1.30,<2", "uvicorn>=0.34,<1", "pydantic>=2.13.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galadril_mcp_service"]

[project.scripts]
galadril-mcp = "galadril_mcp_service.server:main"
