[package]
name = "registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
config = { version = "0.15", features = ["yaml"] }
galadril-registry = { path = "../../platform/registry" }
galadril-ontology = { path = "../../platform/ontology/rust", features = ["remote"] }
loth = { git = "https://github.com/Aeluin-Technologies/loth.git", rev = "e2c3d03f5666f1f2c22bbdcc765f47318bd5dc5e" }
galadril-telemetry.workspace = true
mimalloc.workspace = true
secrecy = "0.10"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
tracing = "0.1"

[dev-dependencies]
sha2 = "0.10"
aws-sdk-s3 = { version = "1.144", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
testcontainers = "0.27"
tokio-stream = { version = "0.1", features = ["net"] }
