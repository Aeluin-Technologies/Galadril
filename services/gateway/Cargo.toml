[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
galadril-registry = { path = "../../platform/registry" }
cedar-policy = "4.12"
axum = "0.8"
graphql-parser = "0.4"
juniper = { version = "0.17", features = ["schema-language"] }
juniper_axum = { version = "0.3", features = ["subscriptions"] }
juniper_graphql_ws = "0.5"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "time", "migrate"] }
pgvector = { version = "0.4", features = ["sqlx"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
config = { version = "0.15", features = ["yaml"] }
secrecy = { version = "0.10", features = ["serde"] }
urlencoding = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
galadril-telemetry.workspace = true
loth = { git = "https://github.com/Aeluin-Technologies/loth.git", rev = "e2c3d03f5666f1f2c22bbdcc765f47318bd5dc5e" }
chrono = "0.4"
aws-config = { version = "1.11", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.144", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
uuid = { version = "1.26", features = ["v4"] }
sanitize-filename = "0.6"
mimalloc = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

[dev-dependencies]
opentelemetry_sdk = "0.32"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
