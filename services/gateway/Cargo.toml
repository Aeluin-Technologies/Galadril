[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cedar-policy = "4.12"
axum = "0.8"
juniper = "0.17"
juniper_axum = { version = "0.3", features = ["subscriptions"] }
juniper_graphql_ws = "0.5"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "time"] }
pgvector = { version = "0.4", features = ["sqlx"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
config = { version = "0.15", features = ["yaml"] }
secrecy = { version = "0.10", features = ["serde"] }
urlencoding = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
galadril-telemetry.workspace = true
loth = { git = "https://github.com/Aeluin-Technologies/loth.git", rev = "cfba8e891bf59bf1d88443d2f7400e561cdd55d0" }
chrono = "0.4"
aws-config = { version = "1.10", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.141"
uuid = { version = "1.24", features = ["v4"] }
sanitize-filename = "0.6"
mimalloc = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = "0.31"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
