name: ${COMPOSE_PROJECT_NAME:-galadril-e2e}

services:
  hydra-migrate:
    extends:
      file: ../../../infrastructure/docker/auth.yaml
      service: hydra-migrate
    container_name: !reset null

  hydra:
    extends:
      file: ../../../infrastructure/docker/auth.yaml
      service: hydra
    container_name: !reset null
    environment:
      TTL_ACCESS_TOKEN: 2h
    volumes: !override
      - type: volume
        source: e2e-hydra
        target: /etc/hydra
        read_only: true

  kratos-migrate:
    extends:
      file: ../../../infrastructure/docker/local-auth.yaml
      service: kratos-migrate
    container_name: !reset null
    profiles: !reset []

  kratos:
    extends:
      file: ../../../infrastructure/docker/local-auth.yaml
      service: kratos
    container_name: !reset null
    profiles: !reset []
    command: [serve, all, --config, /e2e/auth/kratos.yaml]
    environment:
      IDENTITY_SCHEMAS: '[{"id":"local","url":"file:///e2e/auth/identity.schema.json"}]'
    volumes: !override
      - type: volume
        source: e2e-application
        target: /e2e
        read_only: true

  studio:
    extends:
      file: ../../../infrastructure/docker/dashboard.yaml
      service: studio
    container_name: !reset null
    image: local/galadril-studio:e2e
    pull_policy: never
    environment:
      NODE_EXTRA_CA_CERTS: /e2e/auth/ca.pem
    volumes: !override
      - type: volume
        source: e2e-application
        target: /e2e
        read_only: true
    depends_on:
      hydra: {condition: service_started}
      kratos: {condition: service_started}

  postgres:
    extends:
      file: ../../../infrastructure/docker/database.yaml
      service: postgres
    container_name: !reset null
    image: ${GALADRIL_DATABASE_IMAGE:-ghcr.io/aeluin-technologies/galadril-database:latest}
    init: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: galadril_dev
      GALADRIL_APP_PASSWORD: galadril_app
      GALADRIL_MAINTENANCE_PASSWORD: galadril_maintenance
      PGDATA: /home/postgres/pgdata/data
      TIMESCALEDB_TELEMETRY: "off"
    ports: !override
      - "127.0.0.1:15432:5432"
    volumes: !override
      - postgres-data:/home/postgres/pgdata/data
      - type: volume
        source: e2e-database
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --quiet --host=127.0.0.1 --username=postgres --dbname=galadril_dev
      interval: 2s
      timeout: 5s
      retries: 30

  spicedb-migrate:
    extends:
      file: ../../../infrastructure/docker/database.yaml
      service: spicedb-migrate
    container_name: !reset null
    image: authzed/spicedb:v1.56.2
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://postgres:postgres@postgres:5432/spicedb?sslmode=disable
    command: ["datastore", "migrate", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  spicedb-schema:
    extends:
      file: ../../../infrastructure/docker/database.yaml
      service: spicedb-schema
    container_name: !reset null
    volumes: !override
      - type: volume
        source: e2e-application
        target: /e2e
        read_only: true
    command: ["schema", "write", "/e2e/spicedb/schema.zed", "--endpoint", "spicedb:50051", "--insecure", "--token", "secret_key", "--log-format", "json"]

  spicedb:
    extends:
      file: ../../../infrastructure/docker/database.yaml
      service: spicedb
    container_name: !reset null
    image: authzed/spicedb:v1.56.2
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: secret_key
      SPICEDB_GRPC_NO_TLS: "true"
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://postgres:postgres@postgres:5432/spicedb?sslmode=disable
    command: ["serve"]
    ports: !override
      - "127.0.0.1:15051:50051"
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:50051"]
      interval: 2s
      timeout: 5s
      retries: 30

  redpanda:
    extends:
      file: ../../../infrastructure/docker/broker.yaml
      service: redpanda
    container_name: !reset null
    image: redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://127.0.0.1:19092
      - --schema-registry-addr
      - 0.0.0.0:8081
    ports: !override
      - "127.0.0.1:18081:8081"
      - "127.0.0.1:19092:29092"
    volumes: !override
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 2s
      timeout: 10s
      retries: 30

  rustfs:
    extends:
      file: ../../../infrastructure/docker/s3.yaml
      service: rustfs
    container_name: !reset null
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    command: ["rustfs", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://s3-notifications:4195/events
    ports: !override
      - "127.0.0.1:19000:9000"
    volumes: !override
      - rustfs-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30

  s3-notifications:
    extends:
      file: ../../../infrastructure/docker/s3.yaml
      service: s3-notifications
    container_name: !reset null
    volumes: !override
      - type: volume
        source: e2e-application
        target: /e2e
        read_only: true
    command: ["-c", "/e2e/s3-notifications.yaml"]

  rustfs-init:
    extends:
      file: ../../../infrastructure/docker/s3.yaml
      service: rustfs-init
    container_name: !reset null
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://rustfs:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc ready local
        mc mb --ignore-existing local/lake local/models local/staging
        mc event add --ignore-existing local/lake arn:rustfs:sqs:us-east-1:primary:webhook --event put

  lakefs:
    extends:
      file: ../../../infrastructure/docker/s3.yaml
      service: lakefs
    container_name: !reset null
    image: treeverse/lakefs:1.88.0
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://rustfs:9000
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: minioadmin
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: minioadmin
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: development-only-lakefs-encryption-key
      LAKEFS_INSTALLATION_USER_NAME: registry
      LAKEFS_INSTALLATION_ACCESS_KEY_ID: development-registry-access
      LAKEFS_INSTALLATION_SECRET_ACCESS_KEY: development-registry-secret
      LAKEFS_STATS_ENABLED: "false"
      LAKEFS_USAGE_REPORT_ENABLED: "false"
    ports: !override
      - "127.0.0.1:18000:8000"
    volumes: !override
      - lakefs-data:/home/lakefs
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  tempo:
    extends:
      file: ../../../infrastructure/docker/observability.yaml
      service: tempo
    container_name: !reset null
    command: ["-config.file=/e2e/tempo.yaml"]
    ports: !override
      - "127.0.0.1:13200:3200"
    volumes: !override
      - type: volume
        source: e2e-observability
        target: /e2e
        read_only: true
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/e2e/otel-collector.yaml"]
    volumes:
      - type: volume
        source: e2e-observability
        target: /e2e
        read_only: true
    depends_on:
      - tempo

  registry:
    extends:
      file: ../../../infrastructure/docker/streaming.yaml
      service: registry
    container_name: !reset null
    image: local/galadril-registry:e2e
    pull_policy: never
    network_mode: service:api-proxy
    environment:
      REGISTRY_BIND_ADDR: 127.0.0.1:50053
      REGISTRY_CONFIG_PATH: /etc/galadril/connectors.yaml
      LAKEFS_ENDPOINT: http://lakefs:8000
      LAKEFS_ACCESS_KEY_ID: development-registry-access
      LAKEFS_SECRET_ACCESS_KEY: development-registry-secret
      REGISTRY_STORAGE_NAMESPACE: s3://lake/
      REGISTRY_REPOSITORY_PREFIX: galadril-e2e
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: always_on
      DEPLOYMENT_ENVIRONMENT: test
    volumes: !override
      - type: volume
        source: e2e-application
        target: /etc/galadril
        read_only: true
    depends_on:
      lakefs:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure

  chat-model:
    image: local/galadril-chat-model:e2e
    pull_policy: never
    mem_limit: 256m

  scribe:
    extends:
      file: ../../../infrastructure/docker/dashboard.yaml
      service: scribe
    container_name: !reset null
    image: local/galadril-scribe:e2e
    volumes: !reset []
    pull_policy: never
    mem_limit: 512m
    network_mode: service:api-proxy
    environment:
      SCRIBE_HOST: "127.0.0.1"
      SCRIBE_GATEWAY_TOOLS_URL: "http://127.0.0.1:8082/internal/chat/tools"
      SCRIBE_MODELS: '{"fixture":{"model":"e2e","base_url":"http://chat-model:8000/v1","reasoning_efforts":["medium"]}}'
      SCRIBE_DEFAULT_MODEL: "fixture"
      SCRIBE_DOCUMENT_MODEL_CACHE: ""
      SCRIBE_DOCUMENT_EXTRACTION_MODEL: ""
      SCRIBE_MAX_OUTPUT_TOKENS: "8192"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      chat-model:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure

  gateway:
    extends:
      file: ../../../infrastructure/docker/dashboard.yaml
      service: gateway
    container_name: !reset null
    image: local/galadril-gateway:e2e
    pull_policy: never
    network_mode: service:api-proxy
    environment:
      GALADRIL_PIPELINE_PATH: /e2e/connectors.yaml
      SCRIBE__ENABLED: "true"
      DATABASE_URL: postgres://galadril_app:galadril_app@postgres:5432/galadril_dev
      SPICEDB_SCHEMA_PATH: /e2e/spicedb/schema.zed
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: always_on
      DEPLOYMENT_ENVIRONMENT: test
    volumes: !override
      - type: volume
        source: e2e-application
        target: /e2e
        read_only: true
    depends_on: !override
      api-proxy:
        condition: service_started
      rustfs:
        condition: service_healthy
        restart: true
      spicedb-schema:
        condition: service_completed_successfully
      scribe:
        condition: service_started
      registry:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        restart: true
      spicedb:
        condition: service_healthy
        restart: true
      otel-collector:
        condition: service_started
    restart: on-failure

  intake:
    extends:
      file: ../../../infrastructure/docker/streaming.yaml
      service: intake
    container_name: !reset null
    image: local/galadril-intake:e2e
    pull_policy: never
    network_mode: service:api-proxy
    environment:
      INTAKE_BOOTSTRAP_PATH: /e2e/connectors.yaml
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: always_on
      DEPLOYMENT_ENVIRONMENT: test
    volumes: !override
      - type: volume
        source: e2e-application
        target: /e2e
        read_only: true
      - type: volume
        source: e2e-application
        target: /schemas
        read_only: true
    depends_on:
      registry:
        condition: service_started
      redpanda:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: on-failure

  vision:
    extends:
      file: ../../../infrastructure/docker/streaming.yaml
      service: vision
    container_name: !reset null
    image: local/galadril-vision:e2e
    pull_policy: never
    shm_size: "6gb"
    network_mode: service:api-proxy
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      VISION_BOOTSTRAP_PATH: /e2e/connectors.yaml
      VISION_TENANT_ID: debug_tenant
      VISION_PIPELINE_ID: e2e_pipeline
      GRPC_DNS_RESOLVER: native
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /e2e/site-packages
      # The E2E DAG has no dynamic runtime environments. Keeping the raylet
      # alive also makes amd64 images deterministic under arm64 emulation.
      RAY_enable_agent_fate_share: "0"
      RAY_memory_usage_threshold: "0.99"
      RAY_raylet_start_wait_time_s: "60"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER: always_on
      DEPLOYMENT_ENVIRONMENT: test
    entrypoint: ["/app"]
    command:
      - --bootstrap-config
      - /e2e/connectors.yaml
      - --role
      - all
    volumes: !override
      - type: volume
        source: e2e-application
        target: /e2e
        read_only: true
      - type: volume
        source: e2e-application
        target: /schemas
        read_only: true
    depends_on:
      registry:
        condition: service_started
      redpanda:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: on-failure

  api-proxy:
    extends:
      file: ../../../infrastructure/docker/proxy.yaml
      service: api-proxy
    container_name: !reset null
    volumes: !override
      - type: volume
        source: e2e-proxy
        target: /etc/envoy
        read_only: true
    ports: !override
      - 127.0.0.1:18080:8080
      - 127.0.0.1:15052:50052

volumes:
  e2e-hydra:
    external: true
    name: ${E2E_CONFIG_VOLUME}-hydra
  e2e-application:
    external: true
    name: ${E2E_CONFIG_VOLUME}-application
  e2e-observability:
    external: true
    name: ${E2E_CONFIG_VOLUME}-observability
  e2e-database:
    external: true
    name: ${E2E_CONFIG_VOLUME}-database
  e2e-proxy:
    external: true
    name: ${E2E_CONFIG_VOLUME}-proxy
  lakefs-data:
  rustfs-data:
  postgres-data:
  redpanda-data:
  tempo-data:
