receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
  filter/drop_debug:
    error_mode: ignore
    logs:
      log_record:
        - severity_number < SEVERITY_NUMBER_INFO

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  file/logs:
    path: /tmp/galadril-e2e-logs.jsonl
    format: json
    rotation:
      max_megabytes: 4
      max_backups: 1
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [filter/drop_debug, batch]
      exporters: [file/logs]
