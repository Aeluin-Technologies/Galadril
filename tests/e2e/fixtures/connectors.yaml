name: galadril-e2e

gateway:
  host: "127.0.0.1"
  port: 8081
  max_body_bytes: 4096
  max_graphql_depth: 5

scribe:
  enabled: true
  endpoint: "http://127.0.0.1:8092"

registry:
  endpoint: "http://127.0.0.1:50054"

connectors:
  kafka:
    brokers: ["redpanda:9092"]
    schema_registry: "http://redpanda:8081"
    consumer_group: "galadril-e2e"

  telemetry:
    enabled: true
    otlp_endpoint: "http://otel-collector:4317"
    otlp_insecure: true
    environment: "test"
    version: "e2e"

  s3:
    endpoint: "http://minio:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    region: "us-east-1"
    bucket: "lake"
    bucket_notifications: "s3-notification"
    models_bucket: "models"
    staging_bucket: "staging"

  postgres:
    database: "galadril_dev"
    host: "postgres:5432"
    graph_name: "galadril_dev"
    user: "galadril_app"
    password: "galadril_app"
    maintenance_user: "galadril_maintenance"
    maintenance_password: "galadril_maintenance"

  spicedb:
    endpoint: "spicedb:50051"
    token: "secret_key"
    insecure: true

ray:
  namespace: "galadril-e2e"
  actor_replicas: 1
  num_cpus: 3
  num_gpus: 0
  gpu_actor_num_gpus: 0.0

# Keep native LI-ESKG active while deterministic embeddings bound model cost.
identity_resolution:
  enabled: true
  pipeline_probability_weight: 0.0
  candidate_log_prior: 3.0
  noise_log_prior: -10.0
