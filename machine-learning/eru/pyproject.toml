[project]
name = "eru"
version = "0.1.0"
description = "Agnostic ESKG extraction and validation engine."
requires-python = ">=3.13"
dependencies = [
    "galadril-ontology",
    "gliner>=0.2.25",
    "pydantic>=2.13.2",
    "llama-cpp-python>=0.3.9",
    "networkx>=3.6.1",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.44,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
package = true

[tool.uv.sources]
eru = { workspace = true }
galadril-ontology = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
