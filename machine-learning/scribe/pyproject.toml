[project]
name = "galadril-scribe"
version = "0.1.0"
description = "Private, permission-bound PydanticAI chatbot runtime."
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[openai,mcp]==1.107.7",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
    "uvloop>=0.22,<1",
    "structlog>=25,<27",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/galadril_scribe"]
