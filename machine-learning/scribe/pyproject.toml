[project]
name = "galadril-scribe"
version = "0.1.0"
description = "Private, permission-bound PydanticAI chatbot runtime."
requires-python = ">=3.13"
dependencies = [
    "galadril-ontology",
    "galadril-pipeline",
    "galadril-plugins",
    "eru",
    "pydantic-ai-slim[openai,mcp]==2.62.0",
    "pydantic-ai-harness[skills]==0.62.0",
    "pydantic-monty==1.4.0",
    "numpy>=2,<3",
    "galadril-document-memory",
    "matplotlib>=3.11,<4",
    "uv==0.13.6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
    "uvloop>=0.22,<1",
    "structlog>=25,<27",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
    "pypdfium2==5.14.0",
    "galadril-inference[native,onnx-cpu,ocr]",
    "tokenizers>=0.22",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",
    "openai==3.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/galadril_scribe", "python/galadril_sandbox"]

[tool.uv.sources]
galadril-ontology = { workspace = true }
galadril-document-memory = { workspace = true }
galadril-pipeline = { workspace = true }
galadril-plugins = { workspace = true }
eru = { workspace = true }
galadril-inference = { workspace = true }
