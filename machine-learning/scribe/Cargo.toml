[package]
name = "scribe"
description = "Automatic technical writer of Galadril."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[example]]
name = "report"
required-features = ["latex"]

[features]
default = []
latex = ["dep:tectonic", "dep:tera", "dep:chrono"]

[dependencies]
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "e1dd7c8fede7dd29b3d8bc049396cb720daf53a4", features = ["accelerate", "metal", "code-execution"] }
lazy_static = "1"
arc-swap = "1.9"
meval = "0.2"
schemars = "1.2"
url = "2.5"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
opentelemetry = "0.32"
galadril-telemetry.workspace = true
reqwest = { version = "0.13", features = ["json", "stream"] }
image = "0.25"

tectonic = { version = "0.17", features = ["external-harfbuzz"], optional = true }
tera = { version = "1.20", optional = true }
chrono = { version = "0.4", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
