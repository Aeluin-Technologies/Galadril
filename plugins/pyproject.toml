[project]
name = "galadril-plugins"
version = "0.1.0"
description = "Trusted official Galadril plugin runtime and bundled utilities."
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.8,<3",
    "cryptography>=46.0.7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "galadril-pipeline",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "structlog>=25.5.0",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galadril_plugins"]

[project.scripts]
galadril-utils-init = "galadril_plugins.utils.provision:main"
galadril-plugin-deployment = "galadril_plugins.deployment:main"
galadril-plugin-service = "galadril_plugins.worker:main"
