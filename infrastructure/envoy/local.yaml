  - name: health
    address:
      socket_address:
        address: 127.0.0.1
        port_value: 9902
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: health
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          use_remote_address: true
          max_request_headers_kb: 16
          request_headers_timeout: 5s
          stream_idle_timeout: 900s
          common_http_protocol_options: *id001
          route_config:
            name: health
            virtual_hosts:
            - name: health
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                direct_response:
                  status: 404
          http_filters:
          - name: envoy.filters.http.health_check
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
              pass_through_mode: false
              headers:
              - name: :path
                string_match:
                  exact: /healthz
              cluster_min_healthy_percentages:
                application:
                  value: 100
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          tracing: *id002
          access_log: *id003
  - name: registry_health
    address:
      socket_address:
        address: 127.0.0.1
        port_value: 9903
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: health
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          use_remote_address: true
          max_request_headers_kb: 16
          request_headers_timeout: 5s
          stream_idle_timeout: 900s
          common_http_protocol_options: *id001
          route_config:
            name: health
            virtual_hosts:
            - name: health
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                direct_response:
                  status: 404
          http_filters:
          - name: envoy.filters.http.health_check
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
              pass_through_mode: false
              headers:
              - name: :path
                string_match:
                  exact: /healthz
              cluster_min_healthy_percentages:
                registry:
                  value: 100
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          tracing: *id002
          access_log: *id003
  clusters:
  - name: application
    connect_timeout: 3s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: application
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8081
    circuit_breakers:
      thresholds:
      - max_connections: 256
        max_pending_requests: 128
        max_requests: 1024
        max_retries: 0
    health_checks:
    - timeout: 1s
      interval: 3s
      unhealthy_threshold: 2
      healthy_threshold: 1
      http_health_check:
        path: /healthz
    common_lb_config:
      healthy_panic_threshold:
        value: 0
  - name: registry
    connect_timeout: 3s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: registry
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 50053
    circuit_breakers:
      thresholds:
      - max_connections: 256
        max_pending_requests: 128
        max_requests: 1024
