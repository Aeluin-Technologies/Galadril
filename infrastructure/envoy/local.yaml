# Local workloads share one trusted namespace; Ambient supplies workload isolation.
node:
  id: local-api-proxy
  cluster: galadril
admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
stats_flush_interval: 10s
stats_sinks:
- name: envoy.stat_sinks.open_telemetry
  typed_config:
    '@type': type.googleapis.com/envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig
    grpc_service:
      envoy_grpc:
        cluster_name: otel
    emit_tags_as_attributes: true
    prefix: galadril.proxy
    max_data_points_per_request: 1024
static_resources:
  listeners:
  - name: public
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: public
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          use_remote_address: true
          max_request_headers_kb: 16
          request_headers_timeout: 5s
          stream_idle_timeout: 900s
          local_reply_config:
            mappers:
            - filter:
                status_code_filter:
                  comparison: {op: GE, value: {default_value: 500, runtime_key: browser_error_page}}
              headers_to_add:
              - header: {key: x-galadril-error-page, value: '1'}
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header: {key: x-galadril-error-trace, value: '%TRACE_ID%'}
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header: {key: x-request-id, value: '%REQ(X-REQUEST-ID)%'}
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header: {key: cache-control, value: 'private, no-store, max-age=0'}
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header: {key: vary, value: 'Accept, Cookie, Authorization'}
                append_action: APPEND_IF_EXISTS_OR_ADD
            - filter:
                status_code_filter:
                  comparison: {op: GE, value: {default_value: 200, runtime_key: private_local_reply}}
              headers_to_add:
              - header: {key: cache-control, value: 'private, no-store, max-age=0'}
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - header: {key: vary, value: 'Cookie, Authorization'}
                append_action: APPEND_IF_EXISTS_OR_ADD
          common_http_protocol_options: &id001
            idle_timeout: 60s
            max_headers_count: 64
          route_config:
            name: public
            virtual_hosts:
            - name: public
              domains:
              - '*'
              routes:
              - match:
                  prefix: /staging/
                  headers: [{name: ':method', string_match: {exact: PUT}}]
                request_headers_to_remove: [cookie, authorization, traceparent, tracestate]
                tracing: {overall_sampling: {numerator: 0, denominator: HUNDRED}}
                route: {cluster: pengolo_staging, timeout: 120s}
              - match: {prefix: /pengolo/files/}
                request_headers_to_remove: [cookie]
                route: {cluster: application, timeout: 60s}
              - match:
                  path: /graphql
                request_headers_to_remove:
                - cookie
                route:
                  cluster: application
                  timeout: 0s
              - match: {path: /oauth2/auth}
                route: {cluster: hydra, timeout: 10s}
              - match:
                  path: /provisioning/organizations
                  headers:
                  - {name: ':method', string_match: {exact: POST}}
                request_headers_to_remove: [cookie]
                route: {cluster: application, timeout: 60s}
              - match:
                  path: /provisioning/local-organizations
                  headers:
                  - {name: ':method', string_match: {exact: POST}}
                request_headers_to_remove: [cookie]
                route: {cluster: application, timeout: 60s}
              - match:
                  safe_regex:
                    regex: '/identity/self-service/(login(/browser|/flows)?|logout(/browser)?)'
                typed_per_filter_config:
                  envoy.filters.http.local_ratelimit:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: identity_login
                    token_bucket: {max_tokens: 10, tokens_per_fill: 1, fill_interval: 1s}
                    filter_enabled: {default_value: {numerator: 100, denominator: HUNDRED}}
                    filter_enforced: {default_value: {numerator: 100, denominator: HUNDRED}}
                route:
                  cluster: kratos
                  regex_rewrite: {pattern: {regex: '^/identity/'}, substitution: '/'}
                  timeout: 10s
              - match: {prefix: /identity/}
                direct_response: {status: 404}
              - match: {path: /.well-known/openid-configuration}
                route: {cluster: hydra, timeout: 5s}
              - match: {path: /.well-known/jwks.json}
                route: {cluster: hydra, timeout: 5s}
              - match: {path: /api/oauth/authorize}
                route: {cluster: polis, timeout: 10s}
              - match: {path: /api/oauth/saml}
                route: {cluster: polis, timeout: 10s}
              - match: {path: /api/oauth/oidc}
                route: {cluster: polis, timeout: 10s}
              - match: {prefix: /admin/}
                direct_response: {status: 404}
              - match: {prefix: /internal/}
                direct_response: {status: 404}
              - match: {prefix: /api/}
                direct_response: {status: 404}
              # Only static reads are replayable; authentication exchanges are single-use.
              - match:
                  prefix: /_nuxt/
                  headers:
                  - name: ':method'
                    string_match:
                      safe_regex: {regex: 'GET|HEAD'}
                route:
                  cluster: studio
                  timeout: 15s
                  retry_policy:
                    retry_on: gateway-error,reset,connect-failure
                    num_retries: 1
                    per_try_timeout: 5s
              - match: {prefix: /}
                route: {cluster: studio, timeout: 15s}
          http_filters:
          - name: galadril.error_page
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                filename: /etc/envoy/error-page.lua
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: identity_login
          - name: envoy.filters.http.lua
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              inline_code: |
                -- Cookies authenticate browsers, so bind mutations and upgrades to their origin.
                function envoy_on_request(handle)
                  local headers = handle:headers()
                  local path = headers:get(":path") or ""
                  if path:match("^/graphql") or path:match("^/auth/") or path:match("^/media/") or path:match("^/pengolo/files/") then
                    handle:streamInfo():dynamicMetadata():set("galadril.cache", "private", true)
                  end
                  if path:match("^/graphql[?]?") then
                    local cookies = headers:get("cookie") or ""
                    local browser = cookies:find("__Host%-galadril%-token=") or headers:get("upgrade")
                    if browser and headers:get("origin") ~= "https://" .. (headers:get(":authority") or "") then
                      handle:respond({[":status"] = "403"}, "Invalid origin")
                    end
                  end
                end
                function envoy_on_response(handle)
                  local metadata = handle:streamInfo():dynamicMetadata():get("galadril.cache")
                  if (metadata and metadata["private"]) or handle:headers():get("set-cookie") then
                    handle:headers():replace("cache-control", "private, no-store, max-age=0")
                    handle:headers():add("vary", "Cookie, Authorization")
                  end
                end
          - name: envoy.filters.http.header_mutation
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - remove: x-galadril-sub
                - remove: x-galadril-tenant
                - remove: x-galadril-exp
                - remove: x-galadril-issuer
                - remove: x-galadril-role
                - remove: x-galadril-region
                - remove: x-galadril-device-trust
                - remove: x-galadril-acr
                - remove: x-galadril-mfa-generation
                - remove: x-forwarded-client-cert
          - name: envoy.filters.http.jwt_authn
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                identity:
                  issuer: https://aeluin.gravitalia.com
                  audiences:
                  - galadril
                  require_expiration: true
                  clock_skew_seconds: 1
                  remote_jwks:
                    http_uri:
                      uri: https://hydra-proxy:4444/.well-known/jwks.json
                      cluster: hydra
                      timeout: 3s
                    cache_duration: 300s
                    retry_policy:
                      num_retries: 1
                  from_cookies:
                  - __Host-galadril-token
                  from_headers:
                  - name: Authorization
                    value_prefix: 'Bearer '
                  forward: false
                  claim_to_headers:
                  - header_name: x-galadril-sub
                    claim_name: sub
                  - header_name: x-galadril-tenant
                    claim_name: tenant_id
                  - header_name: x-galadril-exp
                    claim_name: exp
                  - header_name: x-galadril-issuer
                    claim_name: iss
                  - header_name: x-galadril-role
                    claim_name: role
                  - header_name: x-galadril-region
                    claim_name: region
                  - header_name: x-galadril-device-trust
                    claim_name: device_trust
                  - header_name: x-galadril-acr
                    claim_name: acr
                  - header_name: x-galadril-mfa-generation
                    claim_name: mfa_generation
              rules:
              - match: {prefix: /pengolo/files/}
                requires: {provider_name: identity}
              - match:
                  path: /graphql
                requires:
                  provider_name: identity
          - name: galadril.jwt_expiration
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              inline_code: |
                -- A zero native skew selects Envoy's default; enforce expiry on verified claims.
                function envoy_on_request(handle)
                  local headers = handle:headers()
                  local path = (headers:get(":path") or ""):match("^[^?]*")
                  if path == "/graphql" or path:match("^/pengolo/files/") then
                    local expiration = tonumber(headers:get("x-galadril-exp"))
                    if not expiration or expiration <= os.time() then
                      handle:respond({[":status"] = "401"}, "Expired credential")
                    end
                  end
                end
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          tracing: &id002
            custom_tags:
            - tag: request.id
              request_header: {name: x-request-id}
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                '@type': type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc:
                    cluster_name: otel
                service_name: api-proxy
          access_log: &id003
          - name: envoy.access_loggers.open_telemetry
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig
              common_config:
                log_name: api-proxy
                grpc_service:
                  envoy_grpc:
                    cluster_name: otel
                transport_api_version: V3
              body:
                string_value: '%RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%'
              attributes:
                values:
                - key: request.id
                  value: {string_value: '%REQ(X-REQUEST-ID)%'}
                - key: trace.id
                  value: {string_value: '%TRACE_ID%'}
                - key: http.request.method
                  value:
                    string_value: '%REQ(:METHOD)%'
                - key: service.name
                  value:
                    string_value: api-proxy
          upgrade_configs:
          - upgrade_type: websocket
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
              tls_maximum_protocol_version: TLSv1_3
            alpn_protocols:
            - h2
            - http/1.1
            tls_certificates:
            - certificate_chain:
                filename: /etc/envoy/public/cert.pem
              private_key:
                filename: /etc/envoy/public/key.pem
  - name: registry_tls
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 50052
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: internal
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          use_remote_address: true
          max_request_headers_kb: 16
          request_headers_timeout: 5s
          stream_idle_timeout: 900s
          common_http_protocol_options: *id001
          route_config:
            name: internal
            virtual_hosts:
            - name: internal
              domains:
              - '*'
              routes:
              - match:
                  prefix: /galadril.registry.v1.Registry/
                route:
                  cluster: registry
                  timeout: 30s
              - match:
                  path: /grpc.health.v1.Health/Check
                route:
                  cluster: registry
                  timeout: 30s
          http_filters:
          - name: envoy.filters.http.header_mutation
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - remove: x-galadril-sub
                - remove: x-galadril-tenant
                - remove: x-galadril-exp
                - remove: x-galadril-issuer
                - remove: x-galadril-role
                - remove: x-galadril-region
                - remove: x-galadril-device-trust
                - remove: x-galadril-acr
                - remove: x-galadril-mfa-generation
                - remove: x-forwarded-client-cert
          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  gateway:
                    principals:
                    - authenticated:
                        principal_name:
                          exact: spiffe://galadril/gateway
                    permissions:
                    - and_rules:
                        rules:
                        - header:
                            name: :method
                            string_match:
                              exact: POST
                        - or_rules:
                            rules:
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ValidateTenants
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DeleteTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListPipelines
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PublishPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DeletePipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListPublishedPipelines
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetRuntimePipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PublishOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/RetireOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListOntologies
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutBinding
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListBindings
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetOntologySlice
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DiffOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/MergeOntology
                  runtime:
                    principals:
                    - authenticated:
                        principal_name:
                          exact: spiffe://galadril/intake
                    - authenticated:
                        principal_name:
                          exact: spiffe://galadril/vision
                    permissions:
                    - and_rules:
                        rules:
                        - header:
                            name: :method
                            string_match:
                              exact: POST
                        - or_rules:
                            rules:
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ValidateTenants
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetRuntimePipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetOntologySlice
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListPublishedPipelines
                  health:
                    principals:
                    - authenticated:
                        principal_name:
                          exact: spiffe://galadril/gateway
                    - authenticated:
                        principal_name:
                          exact: spiffe://galadril/intake
                    - authenticated:
                        principal_name:
                          exact: spiffe://galadril/vision
                    permissions:
                    - and_rules:
                        rules:
                        - header:
                            name: :method
                            string_match:
                              exact: POST
                        - or_rules:
                            rules:
                            - url_path:
                                path:
                                  exact: /grpc.health.v1.Health/Check
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          tracing: *id002
          access_log: *id003
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
              tls_maximum_protocol_version: TLSv1_3
            alpn_protocols:
            - h2
            - http/1.1
            tls_certificates:
            - certificate_chain:
                filename: /etc/envoy/identity/cert.pem
              private_key:
                filename: /etc/envoy/identity/key.pem
            validation_context:
              trusted_ca:
                filename: /etc/envoy/identity/ca.pem
              match_typed_subject_alt_names:
              - san_type: URI
                matcher:
                  exact: spiffe://galadril/gateway
              - san_type: URI
                matcher:
                  exact: spiffe://galadril/intake
              - san_type: URI
                matcher:
                  exact: spiffe://galadril/vision
          require_client_certificate: true
  - name: local_registry
    address:
      socket_address:
        address: 127.0.0.1
        port_value: 50054
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: local_registry
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          use_remote_address: true
          max_request_headers_kb: 16
          request_headers_timeout: 5s
          stream_idle_timeout: 900s
          common_http_protocol_options: *id001
          route_config:
            name: internal
            virtual_hosts:
            - name: internal
              domains:
              - '*'
              routes:
              - match:
                  prefix: /galadril.registry.v1.Registry/
                route:
                  cluster: registry
                  timeout: 30s
              - match:
                  path: /grpc.health.v1.Health/Check
                route:
                  cluster: registry
                  timeout: 30s
          http_filters:
          - name: envoy.filters.http.header_mutation
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - remove: x-galadril-sub
                - remove: x-galadril-tenant
                - remove: x-galadril-exp
                - remove: x-galadril-issuer
                - remove: x-galadril-role
                - remove: x-galadril-region
                - remove: x-galadril-device-trust
                - remove: x-galadril-acr
                - remove: x-galadril-mfa-generation
                - remove: x-forwarded-client-cert
          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  local_api:
                    principals:
                    - any: true
                    permissions:
                    - and_rules:
                        rules:
                        - header:
                            name: :method
                            string_match:
                              exact: POST
                        - or_rules:
                            rules:
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ValidateTenants
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DeleteTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListPipelines
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PublishPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DeletePipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListPublishedPipelines
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetRuntimePipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PublishOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/RetireOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListOntologies
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutBinding
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListBindings
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetOntologySlice
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DiffOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/MergeOntology
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          tracing: *id002
