          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  local_api:
                    principals:
                    - any: true
                    permissions:
                    - and_rules:
                        rules:
                        - header:
                            name: :method
                            string_match:
                              exact: POST
                        - or_rules:
                            rules:
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ValidateTenants
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DeleteTenant
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListPipelines
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PublishPipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DeletePipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListPublishedPipelines
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetRuntimePipeline
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PublishOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/RetireOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListOntologies
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/PutBinding
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/ListBindings
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/GetOntologySlice
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/DiffOntology
                            - url_path:
                                path:
                                  exact: /galadril.registry.v1.Registry/MergeOntology
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          tracing: *id002
