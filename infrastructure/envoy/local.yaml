  - name: egress_scribe
    address:
      socket_address:
        address: 127.0.0.1
        port_value: 8092
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress_scribe
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          use_remote_address: true
          max_request_headers_kb: 16
          request_headers_timeout: 5s
          stream_idle_timeout: 900s
          common_http_protocol_options: *id001
          route_config:
            name: egress_scribe
            virtual_hosts:
            - name: egress_scribe
              domains:
              - '*'
              routes:
              - match:
                  path: /runs
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: scribe
                  timeout: 900s
          http_filters:
          - name: envoy.filters.http.header_mutation
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - remove: x-galadril-sub
                - remove: x-galadril-tenant
