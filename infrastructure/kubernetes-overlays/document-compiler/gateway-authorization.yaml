apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: document-compiler-callback
  namespace: galadril
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [cluster.local/ns/document-compilation/sa/document-compiler]
      to:
        - operation:
            methods: [POST]
            paths: [/internal/document-compiler/authorize]
            ports: ['8081']
