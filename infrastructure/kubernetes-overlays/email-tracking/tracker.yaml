apiVersion: v1
kind: ServiceAccount
metadata:
  name: utils-email-tracker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utils-email-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: utils-email-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: utils-email-tracker
    spec:
      serviceAccountName: utils-email-tracker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tracker
          image: ghcr.io/aeluin-technologies/galadril-utils-email-tracker:latest
          command: [/tracker]
          env:
            - name: UTILS_TRACKER_BIND
              value: 127.0.0.1:8096
            - name: UTILS_TRACKER_IP_SOURCE
              value: cloudflare
            - name: UTILS_TRACKER_SINK
              value: http://utils-email:8095/tracking/open
            - name: UTILS_TRACKING_KEY_FILE
              value: /run/capture/tracking-key
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: [/tracker, --healthcheck]
          startupProbe:
            exec:
              command: [/tracker, --healthcheck]
            failureThreshold: 20
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: capture
              mountPath: /run/capture
              readOnly: true
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
          args: [tunnel, --no-autoupdate, run, --token-file, /run/tunnel/token]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: tunnel
              mountPath: /run/tunnel
              readOnly: true
      volumes:
        - name: capture
          secret:
            secretName: utils-email-tracking-key
            defaultMode: 0440
        - name: tunnel
          secret:
            secretName: utils-email-cloudflare
            defaultMode: 0440
