apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: document-compilation
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: galadril
  namespace: document-compilation
spec:
  address: https://vault.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: galadril
  namespace: document-compilation
spec:
  vaultConnectionRef: galadril
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: galadril-document-compiler
    serviceAccount: vault-secrets
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: document-compiler-storage
  namespace: document-compilation
spec:
  vaultAuthRef: galadril
  mount: kv
  type: kv-v2
  path: galadril/document-compiler-storage
  refreshAfter: 1m
  destination:
    create: true
    name: document-compiler-storage
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: document-compiler
