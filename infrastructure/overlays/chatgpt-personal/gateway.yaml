apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: PENGOLO_CHATGPT_ENABLED
              value: "true"
            - name: PENGOLO_CHATGPT_CALLBACK_BIND
              value: "0.0.0.0:1455"
          ports:
            - name: chatgpt-local
              containerPort: 1455
