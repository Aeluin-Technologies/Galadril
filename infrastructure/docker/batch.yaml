services:
  intake:
    image: ghcr.io/aeluin-technologies/galadril-intake:latest
    platform: linux/amd64
    container_name: intake
    depends_on:
      - redpanda
      - minio
      - minio-init
    environment:
      - KAFKA_CONSUMER_GROUP=intake-service
      - KAFKA_TOPIC_NOTIFICATIONS=s3-notification
      - SCHEMA_REGISTRY=http://redpanda:8081
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    volumes:
      - ../../examples/pipeline.yaml:/bootstrap.yaml
      - ../../schemas:/schemas

  vision:
    image: ghcr.io/aeluin-technologies/galadril-vision:latest
    container_name: vision
    tty: true
    depends_on:
      - redpanda
      - minio
      - postgres
      - spicedb
    environment:
      APP_ENV: development
      PIPELINE_PATH: /pipeline.yaml
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONUNBUFFERED: "1"
    expose:
      - "4000"
    volumes:
      - ../../examples/pipeline.yaml:/pipeline.yaml:ro
      - ../../examples/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ../../schemas:/schemas:ro
      - dagster-home:/opt/dagster/dagster_home
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        python -m pip install --no-cache-dir "dagster==1.13.11"
        exec python -m galadril_vision.main \
          --bootstrap-config /pipeline.yaml \
          --grpc-host 0.0.0.0 \
          --grpc-port 4000

  dagster-webserver:
    image: ghcr.io/aeluin-technologies/galadril-vision:latest
    container_name: dagster-webserver
    ports:
      - "3005:3000"
    depends_on:
      - vision
    environment:
      APP_ENV: development
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../examples/workspace.yaml:/workspace.yaml:ro
      - ../../examples/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - dagster-home:/opt/dagster/dagster_home
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        python -m pip install --no-cache-dir \
          "dagster==1.13.11" \
          "dagster-webserver==1.13.11"
        exec python -m dagster_webserver \
          -h 0.0.0.0 \
          -p 3000 \
          -w /workspace.yaml

  dagster-daemon:
    image: ghcr.io/aeluin-technologies/galadril-vision:latest
    container_name: dagster-daemon
    depends_on:
      - vision
      - dagster-webserver
    environment:
      APP_ENV: development
      PIPELINE_PATH: /pipeline.yaml
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../examples/pipeline.yaml:/pipeline.yaml:ro
      - ../../examples/workspace.yaml:/workspace.yaml:ro
      - ../../examples/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ../../schemas:/schemas:ro
      - dagster-home:/opt/dagster/dagster_home
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        python -m pip install --no-cache-dir "dagster==1.13.11"
        exec dagster-daemon run -w /workspace.yaml

volumes:
  dagster-home:
