services:
  studio:
    image: ghcr.io/aeluin-technologies/galadril-studio:latest
    container_name: studio
    ports:
      - 3000:3000
    environment:
      GRAPHQL_ENDPOINT: http://gateway:8080

  gateway:
    image: ghcr.io/aeluin-technologies/galadril-gateway:latest
    platform: linux/amd64
    container_name: gateway
    ports:
      - 8080:8080
    environment:
      GALADRIL_PIPELINE_PATH: pipeline.yaml
      JWT_ISSUER: "https://aeluin.gravitalia.com"
      JWT_AUDIENCE: "galadril"
      PUBLIC_KEY_PEM: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEEVs/o5+uQbTjL3chynL4wXgUg2R9
        q9UU8I5mEovUf86QZ7kOBIjJwqnzD1omageEHWwHdBO6B+dFabmdT9POxg==
        -----END PUBLIC KEY-----
      PRIVATE_KEY_PEM: |
        -----BEGIN PRIVATE KEY-----
        MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hb2
        OF/2NxApJCzGCEDdfSp6VQO30hyhRANCAAQRWz+jn65BtOMvdyHKcvjBeBSDZH2r
        1RTwjmYSi9R/zpBnuQ4EiMnCqfMPWiZqB4QdbAd0E7oH50VpuZ1P087G
        -----END PRIVATE KEY-----
    depends_on:
      - redpanda
      - minio
      - postgres
      - spicedb
    volumes:
      - ../../examples/pipeline.yaml:/pipeline.yaml
