services:
  searxng:
    container_name: searxng
    user: searxng
    image: ghcr.io/searxng/searxng:2026.10.17-1c10abe2d@sha256:8bdd9aa136b2dc3b9332cf24714fa34a375b8a1949a1201ec900c24d7378596e
    restart: unless-stopped
    environment:
      GRANIAN_HOST: 0.0.0.0
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - type: bind
        source: ./searxng/settings.yml
        target: /etc/searxng/settings.yml
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128

  studio:
    container_name: studio
    image: ${GALADRIL_STUDIO_IMAGE:-ghcr.io/aeluin-technologies/galadril-studio:latest}
    restart: unless-stopped
    init: true
    network_mode: service:api-proxy
    environment:
      HOST: 127.0.0.1
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-https://localhost:8080}
      AUTH_ISSUER: https://aeluin.gravitalia.com
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-false}
      AUTH_KRATOS_PUBLIC_URL: http://127.0.0.1:4433
      AUTH_KRATOS_ADMIN_URL: http://127.0.0.1:4434
      AUTH_HYDRA_PUBLIC_URL: https://127.0.0.1:4444
      AUTH_HYDRA_ADMIN_URL: http://127.0.0.1:4445
      AUTH_POLIS_URL: http://127.0.0.1:5225
      AUTH_POLIS_API_KEY: ${POLIS_API_KEY:?Set POLIS_API_KEY}
      AUTH_JWKS_URL: https://127.0.0.1:4444/.well-known/jwks.json
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:?Set AUTH_CLIENT_SECRET}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Set a random AUTH_SESSION_SECRET of at least 32 characters}
      AUTH_GATEWAY_URL: http://127.0.0.1:8081/internal/auth/graphql
      AUTH_GATEWAY_KEY: ${AUTH_GATEWAY_KEY:?Set a random AUTH_GATEWAY_KEY of at least 32 characters}
      NODE_EXTRA_CA_CERTS: /etc/auth/ca.pem
      NUXT_AGGREGATE_METRICS_ENABLED: ${NUXT_AGGREGATE_METRICS_ENABLED:-false}
      NUXT_METRICS_OTLP_ENDPOINT: http://otel-collector:4318/v1/metrics
    volumes:
      - ${GALADRIL_IDENTITY_DIR:-../../.local/identity}/hydra/ca.pem:/etc/auth/ca.pem:ro
    depends_on:
      gateway:
        condition: service_started
    stop_grace_period: 15s

  gateway:
    container_name: gateway
    image: ${GALADRIL_GATEWAY_IMAGE:-ghcr.io/aeluin-technologies/galadril-gateway:latest}
    restart: unless-stopped
    init: true
    network_mode: service:api-proxy
    environment:
      UTILS_SERVICE_URL: http://127.0.0.1:8095
      UTILS_SERVICE_KEY_FILE: /run/galadril-utils/service-key
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-false}
      GALADRIL_PIPELINE_PATH: /connectors.yaml
      AUTH_DATABASE_URL: postgres://galadril_auth:${GALADRIL_AUTH_PASSWORD:?Set GALADRIL_AUTH_PASSWORD}@postgres:5432/${POSTGRES_DB:-galadril_dev}
      AUTH_GATEWAY_KEY: ${AUTH_GATEWAY_KEY:?Set a random AUTH_GATEWAY_KEY of at least 32 characters}
      DATABASE_URL: postgres://galadril_app:${GALADRIL_APP_PASSWORD:-galadril_app}@postgres:5432/${POSTGRES_DB:-galadril_dev}
      SSO_POLIS_URL: http://127.0.0.1:5225
      SSO_POLIS_API_KEY: ${POLIS_API_KEY:?Set POLIS_API_KEY}
      SSO_PROVISIONING_KEY: ${SSO_PROVISIONING_KEY:?Set SSO_PROVISIONING_KEY}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-https://localhost:8080}
      SCRIBE__ENABLED: ${SCRIBE_ENABLED:-true}
      PENGOLO_CHATGPT_ENABLED: ${GALADRIL_CHATGPT_ENABLED:-false}
      PENGOLO_CHATGPT_CALLBACK_BIND: 0.0.0.0:${GALADRIL_CHATGPT_CALLBACK_PORT:-1455}
      PENGOLO_WEB_SEARCH_PROVIDER: ${PENGOLO_WEB_SEARCH_PROVIDER:-searxng}
      PENGOLO_WEB_SEARCH_URL: ${PENGOLO_WEB_SEARCH_URL:-http://searxng:8080/search}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
      OTEL_SERVICE_VERSION: "0.1.0"
      DEPLOYMENT_ENVIRONMENT: development
    depends_on:
      searxng:
        condition: service_started
      api-proxy:
        condition: service_started
      registry:
        condition: service_started
      rustfs:
        condition: service_healthy
        restart: true
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        restart: true
      spicedb:
        condition: service_healthy
        restart: true
      spicedb-schema:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    volumes:
      - ${GALADRIL_CONNECTORS_PATH:-./connectors.yaml}:/connectors.yaml:ro
      - ../../schemas:/schemas:ro
      - type: bind
        source: ${GALADRIL_UTILS_PRIVATE_DIR:-../../.local/utils-email/private}/service-key
        target: /run/galadril-utils/service-key
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 30s

  scribe:
    container_name: scribe
    mem_limit: ${SCRIBE_MEMORY_LIMIT:-5g}
    memswap_limit: ${SCRIBE_MEMORY_LIMIT:-5g}
    cpus: ${SCRIBE_CPUS:-3}
    image: ${GALADRIL_SCRIBE_IMAGE:-ghcr.io/aeluin-technologies/galadril-scribe:latest}
    network_mode: service:api-proxy
    restart: unless-stopped
    init: true
    environment:
      UTILS_SERVICE_KEY_FILE: /run/galadril-utils/service-key
      SCRIBE_HOST: "127.0.0.1"
      SCRIBE_GATEWAY_TOOLS_URL: http://127.0.0.1:8082/internal/chat/tools
      SCRIBE_MODELS: '${SCRIBE_MODELS:-{"local":{"model":"local","base_url":"http://host.docker.internal:8080/v1"}}}'
      SCRIBE_DEFAULT_MODEL: ${SCRIBE_DEFAULT_MODEL-local}
      SCRIBE_OPENAI_API_KEY: ${SCRIBE_OPENAI_API_KEY:-}
      SCRIBE_CHATGPT_ENABLED: ${GALADRIL_CHATGPT_ENABLED:-false}
      SCRIBE_CHATGPT_ENCRYPTION_KEY: ${SCRIBE_CHATGPT_ENCRYPTION_KEY:-}
      SCRIBE_CHATGPT_CREDENTIALS_PATH: /var/lib/galadril/chatgpt/private/accounts.sqlite
      SCRIBE_WEB_SEARCH_PROVIDER: ${SCRIBE_WEB_SEARCH_PROVIDER:-gateway}
      SCRIBE_PYTHON_SANDBOX_SOCKET: ${SCRIBE_PYTHON_SANDBOX_SOCKET:-}
      SCRIBE_DOCUMENT_MODEL_CACHE: /var/lib/galadril/models
      SCRIBE_DOCUMENT_EMBEDDING_COMPUTE_TYPE: ${SCRIBE_DOCUMENT_EMBEDDING_COMPUTE_TYPE:-bf16}
      OMP_NUM_THREADS: ${SCRIBE_INFERENCE_THREADS:-2}
      MKL_NUM_THREADS: ${SCRIBE_INFERENCE_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${SCRIBE_INFERENCE_THREADS:-2}
      GALADRIL_ONNX_INTRA_OP_THREADS: ${SCRIBE_INFERENCE_THREADS:-2}
      GALADRIL_ONNX_INTER_OP_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      SCRIBE_DOCUMENT_EXTRACTION_MODEL: ${SCRIBE_DOCUMENT_EXTRACTION_MODEL:-}
      SCRIBE_DOCUMENT_REMOTE_RELATIONS: ${SCRIBE_DOCUMENT_REMOTE_RELATIONS:-true}
      SCRIBE_DOCUMENT_RELATION_MODEL: ${SCRIBE_DOCUMENT_RELATION_MODEL:-gpt-5.6-terra}
      SCRIBE_DOCUMENT_ERU_TIER: ${SCRIBE_DOCUMENT_ERU_TIER:-0.6b}
      SCRIBE_DOCUMENT_RERANKER: ${SCRIBE_DOCUMENT_RERANKER:-bge}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      - scribe-models:/var/lib/galadril/models
      - scribe-chatgpt:/var/lib/galadril/chatgpt
      - type: bind
        source: ${GALADRIL_UTILS_PRIVATE_DIR:-../../.local/utils-email/private}/service-key
        target: /run/galadril-utils/service-key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api-proxy:
        condition: service_started
      otel-collector:
        condition: service_started
    stop_grace_period: 30s

volumes:
  scribe-models:
  scribe-chatgpt:
