services:
  studio:
    container_name: studio
    image: ${GALADRIL_STUDIO_IMAGE:-ghcr.io/aeluin-technologies/galadril-studio:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    environment:
      NUXT_PUBLIC_GRAPHQL_ENDPOINT: ${NUXT_PUBLIC_GRAPHQL_ENDPOINT:-http://localhost:8080/graphql}
      NUXT_PUBLIC_GRAPHQL_WS_ENDPOINT: ${NUXT_PUBLIC_GRAPHQL_WS_ENDPOINT:-ws://localhost:8080/graphql}
    depends_on:
      gateway:
        condition: service_started
    stop_grace_period: 15s

  gateway:
    container_name: gateway
    image: ${GALADRIL_GATEWAY_IMAGE:-ghcr.io/aeluin-technologies/galadril-gateway:latest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GALADRIL_PIPELINE_PATH: /pipeline.yaml
      JWT_ISSUER: "https://aeluin.gravitalia.com"
      JWT_AUDIENCE: "galadril"
      PUBLIC_KEY_PEM: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEEVs/o5+uQbTjL3chynL4wXgUg2R9
        q9UU8I5mEovUf86QZ7kOBIjJwqnzD1omageEHWwHdBO6B+dFabmdT9POxg==
        -----END PUBLIC KEY-----
      PRIVATE_KEY_PEM: |
        -----BEGIN PRIVATE KEY-----
        MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgevZzL1gdAFr88hb2
        OF/2NxApJCzGCEDdfSp6VQO30hyhRANCAAQRWz+jn65BtOMvdyHKcvjBeBSDZH2r
        1RTwjmYSi9R/zpBnuQ4EiMnCqfMPWiZqB4QdbAd0E7oH50VpuZ1P087G
        -----END PRIVATE KEY-----
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
      OTEL_SERVICE_VERSION: "0.1.0"
      DEPLOYMENT_ENVIRONMENT: development
    depends_on:
      minio:
        condition: service_healthy
        restart: true
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        restart: true
      spicedb:
        condition: service_healthy
        restart: true
      otel-collector:
        condition: service_started
    volumes:
      - ../../examples/pipeline.yaml:/pipeline.yaml:ro
    stop_grace_period: 30s
