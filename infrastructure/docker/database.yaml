services:
  postgres:
    container_name: postgres
    image: ${GALADRIL_DATABASE_IMAGE:-ghcr.io/aeluin-technologies/galadril-database:latest}
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-galadril_dev}
      GALADRIL_APP_PASSWORD: ${GALADRIL_APP_PASSWORD:-galadril_app}
      GALADRIL_MAINTENANCE_PASSWORD: ${GALADRIL_MAINTENANCE_PASSWORD:-galadril_maintenance}
      PGDATA: /home/postgres/pgdata/data
      TIMESCALEDB_TELEMETRY: "off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./init-scripts/01-init-spicedb.sh:/docker-entrypoint-initdb.d/010-init-spicedb.sh:ro
      - ./init-scripts/02-init-galadril-roles.sh:/docker-entrypoint-initdb.d/020-init-galadril-roles.sh:ro
    stop_grace_period: 1m

  spicedb-migrate:
    container_name: spicedb-migrate
    image: ${SPICEDB_IMAGE:-authzed/spicedb:v1.56.0}
    restart: "no"
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/spicedb?sslmode=disable
    command: ["datastore", "migrate", "head"]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true

  spicedb:
    container_name: spicedb
    image: ${SPICEDB_IMAGE:-authzed/spicedb:v1.56.0}
    restart: unless-stopped
    init: true
    ports:
      - "${SPICEDB_GRPC_PORT:-50051}:50051"
      - "${SPICEDB_DISPATCH_PORT:-50052}:50052"
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY:-secret_key}
      SPICEDB_GRPC_NO_TLS: "true"
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/spicedb?sslmode=disable
    command: ["serve"]
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:50051"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  terminusdb:
    container_name: terminusdb
    image: ${TERMINUSDB_IMAGE:-terminusdb/terminusdb-server:v12.0.7}
    restart: unless-stopped
    init: true
    environment:
      TERMINUSDB_ADMIN_PASS: ${TERMINUSDB_ADMIN_PASS:-development-root}
    ports:
      - "127.0.0.1:${TERMINUSDB_PORT:-6363}:6363"
    volumes:
      - terminusdb_data:/app/terminusdb/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6363"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 1m

  terminusdb-init:
    container_name: terminusdb-init
    image: ${TERMINUSDB_INIT_IMAGE:-curlimages/curl:8.12.1}
    restart: "no"
    init: true
    depends_on:
      terminusdb:
        condition: service_healthy
    environment:
      TERMINUSDB_ADMIN_PASS: ${TERMINUSDB_ADMIN_PASS:-development-root}
    entrypoint: ["sh", "/init-terminusdb.sh"]
    volumes:
      - ./init-scripts/03-init-terminusdb.sh:/init-terminusdb.sh:ro

volumes:
  postgres_data:
  terminusdb_data:
