services:
  api-proxy:
    image: envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865
    container_name: api-proxy
    user: ${GALADRIL_PROXY_UID:-1000}:${GALADRIL_PROXY_GID:-1000}
    command:
    - -c
    - /etc/envoy/envoy.yaml
    - --log-level
    - warn
    - --concurrency
    - '2'
    - --drain-time-s
    - '15'
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    volumes:
    - type: bind
      source: ../envoy/local.yaml
      target: /etc/envoy/envoy.yaml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${GALADRIL_IDENTITY_DIR:-../../.local/identity}/registry/ca.pem
      target: /etc/envoy/identity/ca.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${GALADRIL_IDENTITY_DIR:-../../.local/identity}/registry/cert.pem
      target: /etc/envoy/identity/cert.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${GALADRIL_IDENTITY_DIR:-../../.local/identity}/registry/key.pem
      target: /etc/envoy/identity/key.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${GALADRIL_PUBLIC_TLS_DIR:-../../.local/identity/gateway}/cert.pem
      target: /etc/envoy/public/cert.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${GALADRIL_PUBLIC_TLS_DIR:-../../.local/identity/gateway}/key.pem
      target: /etc/envoy/public/key.pem
      read_only: true
      bind:
        create_host_path: false
    stop_grace_period: 30s
    ports:
    - ${GATEWAY_PORT:-8080}:8080
    - 127.0.0.1:${GALADRIL_CHATGPT_CALLBACK_PORT:-1455}:${GALADRIL_CHATGPT_CALLBACK_PORT:-1455}
