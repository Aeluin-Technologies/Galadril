services:
  minio:
    container_name: minio
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    init: true
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY: redpanda:9092
      MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY: s3-notification
    volumes:
      - minio-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  minio-init:
    container_name: minio-init
    image: ${MINIO_CLIENT_IMAGE:-minio/mc:latest}
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc ready local
        mc mb --ignore-existing local/lake local/models local/config local/staging
        mc event add --ignore-existing local/lake arn:minio:sqs::PRIMARY:kafka --event put

volumes:
  minio-data:
