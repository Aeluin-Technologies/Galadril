services:
  minio:
    container_name: minio
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    init: true
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY: redpanda:9092
      MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY: s3-notification
    volumes:
      - minio-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  minio-init:
    container_name: minio-init
    image: ${MINIO_CLIENT_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc ready local
        mc mb --ignore-existing local/lake local/models local/staging
        mc event add --ignore-existing local/lake arn:minio:sqs::PRIMARY:kafka --event put

  lakefs:
    container_name: lakefs
    image: ${LAKEFS_IMAGE:-treeverse/lakefs:1.86.0}
    restart: unless-stopped
    init: true
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LAKEFS_PORT:-8000}:8000"
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_AUTH_ENCRYPT_SECRET_KEY:-development-only-lakefs-encryption-key}
      LAKEFS_INSTALLATION_USER_NAME: registry
      LAKEFS_INSTALLATION_ACCESS_KEY_ID: ${LAKEFS_ACCESS_KEY_ID:-development-registry-access}
      LAKEFS_INSTALLATION_SECRET_ACCESS_KEY: ${LAKEFS_SECRET_ACCESS_KEY:-development-registry-secret}
      LAKEFS_STATS_ENABLED: "false"
      LAKEFS_USAGE_REPORT_ENABLED: "false"
    volumes:
      - lakefs-data:/home/lakefs
    stop_grace_period: 30s

volumes:
  minio-data:
  lakefs-data:
