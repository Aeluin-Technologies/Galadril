# Role-isolated FastStream services and their Ray compute cluster.
x-vision-service: &vision-service
  image: ghcr.io/aeluin-technologies/galadril-vision:latest
  restart: unless-stopped
  depends_on:
    - redpanda
    - minio
    - postgres
    - spicedb
    - ray-head
    - otel-collector
  environment:
    APP_ENV: development
    PIPELINE_PATH: /pipeline.yaml
    PYTHONUNBUFFERED: "1"
  volumes:
    - ../../examples/pipeline.yaml:/pipeline.yaml:ro
    - ../../schemas:/schemas:ro
  entrypoint: ["/app"]

services:
  intake:
    image: ghcr.io/aeluin-technologies/galadril-intake:latest
    platform: linux/amd64
    container_name: intake
    depends_on:
      - redpanda
      - minio
      - minio-init
    environment:
      KAFKA_CONSUMER_GROUP: intake-service
      KAFKA_TOPIC_NOTIFICATIONS: s3-notification
      SCHEMA_REGISTRY: http://redpanda:8081
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - ../../examples/pipeline.yaml:/bootstrap.yaml:ro
      - ../../schemas:/schemas:ro

  ray-head:
    image: ghcr.io/aeluin-technologies/galadril-vision:latest
    container_name: ray-head
    restart: unless-stopped
    ports:
      - "8265:8265"
      - "10001:10001"
    environment:
      PYTHONUNBUFFERED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    entrypoint: ["python", "-m", "ray.scripts.scripts", "start"]
    command:
      - --head
      - --node-ip-address=0.0.0.0
      - --port=6379
      - --ray-client-server-port=10001
      - --dashboard-host=0.0.0.0
      - --metrics-export-port=8080
      - --block

  ray-gpu-worker:
    image: ghcr.io/aeluin-technologies/galadril-vision:latest
    container_name: ray-gpu-worker
    restart: unless-stopped
    profiles: ["gpu"]
    depends_on:
      - ray-head
    environment:
      PYTHONUNBUFFERED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    entrypoint: ["python", "-m", "ray.scripts.scripts", "start"]
    command:
      - --address=ray-head:6379
      - --num-gpus=1
      - --metrics-export-port=8080
      - --block
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  vision-ingress:
    <<: *vision-service
    container_name: vision-ingress
    ports:
      - "8000:8000"
    command:
      - --bootstrap-config
      - /pipeline.yaml
      - --role
      - ingress
      - --port
      - "8000"

  vision-cpu:
    <<: *vision-service
    container_name: vision-cpu
    ports:
      - "8001:8000"
    command:
      - --bootstrap-config
      - /pipeline.yaml
      - --role
      - cpu
      - --port
      - "8000"

  vision-gpu:
    <<: *vision-service
    container_name: vision-gpu
    ports:
      - "8002:8000"
    command:
      - --bootstrap-config
      - /pipeline.yaml
      - --role
      - gpu
      - --port
      - "8000"

  vision-causal:
    <<: *vision-service
    container_name: vision-causal
    ports:
      - "8003:8000"
    command:
      - --bootstrap-config
      - /pipeline.yaml
      - --role
      - causal
      - --port
      - "8000"
