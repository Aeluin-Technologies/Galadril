# Role-isolated FastStream services with process-local Ray runtimes.
x-vision-service: &vision-service
  image: ${GALADRIL_VISION_IMAGE:-ghcr.io/aeluin-technologies/galadril-vision:latest}
  restart: unless-stopped
  depends_on:
    redpanda:
      condition: service_healthy
      restart: true
    minio:
      condition: service_healthy
      restart: true
    minio-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
      restart: true
    spicedb:
      condition: service_healthy
      restart: true
    otel-collector:
      condition: service_started
  environment:
    APP_ENV: development
    LOG_LEVEL: ${VISION_LOG_LEVEL:-INFO}
    PIPELINE_PATH: /pipeline.yaml
    PYTHONUNBUFFERED: "1"
  volumes:
    - ../../examples/pipeline.yaml:/pipeline.yaml:ro
    - ../../schemas:/schemas:ro
  entrypoint: ["/app"]

services:
  intake:
    image: ${GALADRIL_INTAKE_IMAGE:-ghcr.io/aeluin-technologies/galadril-intake:latest}
    platform: linux/amd64
    container_name: intake
    restart: unless-stopped
    init: true
    depends_on:
      redpanda:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      KAFKA_CONSUMER_GROUP: intake-service
      KAFKA_TOPIC_NOTIFICATIONS: s3-notification
      SCHEMA_REGISTRY: http://redpanda:8081
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - ../../examples/pipeline.yaml:/bootstrap.yaml:ro
      - ../../schemas:/schemas:ro
    stop_grace_period: 30s

  vision-ingress:
    <<: *vision-service
    container_name: vision-ingress
    command:
      - --bootstrap-config
      - /pipeline.yaml
      - --role
      - ingress

  vision-cpu:
    <<: *vision-service
    container_name: vision-cpu
    command:
      - --bootstrap-config
      - /pipeline.yaml
      - --role
      - cpu

  vision-gpu:
    <<: *vision-service
    container_name: vision-gpu
    profiles: ["gpu"]
    command:
      - --bootstrap-config
      - /pipeline.yaml
      - --role
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  vision-causal:
    <<: *vision-service
    container_name: vision-causal
    command:
      - --bootstrap-config
      - /pipeline.yaml
      - --role
      - causal
