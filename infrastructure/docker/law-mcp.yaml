# Optional legal provider; the shared workspace MCP runs without these credentials.
services:
  mcp:
    environment:
      MCP_NAMESPACES: '[{"provider":"workspace","capability_id":"core.mcp.workspace","path":"/workspace/mcp","scopes":["workspace:use"],"clients":["galadril-mcp-chatgpt-workspace"],"request_body_limit":1048576},{"provider":"piste","capability_id":"law.mcp.research","path":"/law/mcp","scopes":["legal:read"],"clients":["galadril-mcp-chatgpt-law"]}]'
      LAW_PISTE_CREDENTIALS_FILE: /run/secrets/piste-key
      LAW_PISTE_OAUTH_FILE: /run/secrets/piste-oauth
    volumes:
      - type: bind
        source: ${GALADRIL_PISTE_KEY_FILE:-../../.local/piste-key}
        target: /run/secrets/piste-key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GALADRIL_PISTE_OAUTH_FILE:-../../.local/piste-oauth-key}
        target: /run/secrets/piste-oauth
        read_only: true
        bind: {create_host_path: false}
