services:
  law-mcp:
    image: ${GALADRIL_MCP_IMAGE:-ghcr.io/aeluin-technologies/galadril-mcp:latest}
    network_mode: service:api-proxy
    user: ${GALADRIL_MCP_UID:-1000}:${GALADRIL_MCP_GID:-1000}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    cpus: 1
    environment:
      MCP_HOST: 127.0.0.1
      MCP_PORT: "8097"
      MCP_PUBLIC_ORIGIN: https://mcp.gravitalia.com
      MCP_NAMESPACES: '[{"provider":"piste","capability_id":"law.mcp.research","path":"/law/mcp","scopes":["legal:read"],"clients":["galadril-mcp-chatgpt-law"]}]'
      MCP_GATEWAY_TOOLS_URL: http://127.0.0.1:8082/internal/chat/tools
      MCP_OAUTH_ISSUER: ${AUTH_ISSUER:-https://aeluin.gravitalia.com}
      MCP_JWKS_URL: ${MCP_JWKS_URL:-https://aeluin.gravitalia.com/.well-known/jwks.json}
      MCP_REQUIRED_SCOPES: legal:read
      MCP_ALLOWED_CLIENTS: ${MCP_ALLOWED_CLIENTS:-galadril-mcp-chatgpt-law}
      LAW_PISTE_CREDENTIALS_FILE: /run/secrets/piste-key
      LAW_PISTE_OAUTH_FILE: /run/secrets/piste-oauth
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      - type: bind
        source: ${GALADRIL_PISTE_KEY_FILE:-../../.local/piste-key}
        target: /run/secrets/piste-key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GALADRIL_PISTE_OAUTH_FILE:-../../.local/piste-oauth-key}
        target: /run/secrets/piste-oauth
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      api-proxy: {condition: service_started}
      otel-collector: {condition: service_started}

  law-mcp-envoy:
    image: envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865
    command: [-c, /etc/envoy/envoy.yaml, --log-level, warn, --concurrency, "1"]
    network_mode: service:api-proxy
    user: ${GALADRIL_PROXY_UID:-1000}:${GALADRIL_PROXY_GID:-1000}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    cpus: 0.5
    volumes:
      - type: bind
        source: ../envoy/law-mcp.yaml
        target: /etc/envoy/envoy.yaml
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      law-mcp: {condition: service_started}

  law-mcp-tunnel:
    profiles: [mcp-public]
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    command: [tunnel, --no-autoupdate, run, --token-file, /run/tunnel/token]
    network_mode: service:api-proxy
    user: ${GALADRIL_MCP_UID:-1000}:${GALADRIL_MCP_GID:-1000}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    cpus: 0.5
    volumes:
      - type: bind
        source: ${GALADRIL_MCP_TUNNEL_TOKEN_FILE:-../../.local/mcp/cloudflare/token}
        target: /run/tunnel/token
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      law-mcp-envoy: {condition: service_started}
