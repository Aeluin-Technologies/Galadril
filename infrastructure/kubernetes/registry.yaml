apiVersion: v1
kind: ConfigMap
metadata:
  name: registry
data:
  REGISTRY_BIND_ADDR: 0.0.0.0:50052
  LAKEFS_ENDPOINT: http://lakefs:8000
  REGISTRY_STORAGE_NAMESPACE: s3://galadril-registry/registry/
  REGISTRY_REPOSITORY_PREFIX: galadril
  REGISTRY_S3_ENDPOINT: https://s3.us-east-1.amazonaws.com
  REGISTRY_S3_REGION: us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  # Writes are serialized per tenant in-process; scale after distributed
  # branch locking is introduced at the lakeFS transaction boundary.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      containers:
        - name: registry
          image: ghcr.io/aeluin-technologies/galadril-registry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
          envFrom:
            - configMapRef:
                name: registry
          env:
            - name: LAKEFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: registry-lakefs
                  key: access-key-id
            - name: LAKEFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: registry-lakefs
                  key: secret-access-key
            - name: REGISTRY_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: registry-s3
                  key: access-key-id
            - name: REGISTRY_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: registry-s3
                  key: secret-access-key
          readinessProbe:
            grpc:
              port: 50052
          livenessProbe:
            grpc:
              port: 50052
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
