apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: api-observability
spec:
  tracing:
    - providers:
        - name: otlp
      randomSamplingPercentage: 10
      customTags:
        request.id:
          header:
            name: x-request-id
  accessLogging:
    - providers:
        - name: otlp-logs
