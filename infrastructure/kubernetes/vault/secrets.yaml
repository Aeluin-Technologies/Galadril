apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: galadril
spec:
  address: https://vault.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: galadril
spec:
  vaultConnectionRef: galadril
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: galadril-secrets
    serviceAccount: vault-secrets
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: galadril-public-tls
spec:
  vaultAuthRef: galadril
  mount: pki_int
  role: galadril-public
  commonName: api.galadril.example
  ttl: 24h
  expiryOffset: 1h
  destination:
    create: true
    name: galadril-public-tls
    type: kubernetes.io/tls
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gateway-connectors
spec:
  vaultAuthRef: galadril
  mount: kv
  type: kv-v2
  path: galadril/gateway-connectors
  refreshAfter: 1m
  destination:
    create: true
    name: gateway-connectors
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: gateway
---
