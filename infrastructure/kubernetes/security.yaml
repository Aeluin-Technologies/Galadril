apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict-mtls
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-transport
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/api-waypoint
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: registry-transport
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/api-waypoint
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: intake-transport
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intake
  action: ALLOW
  rules: []
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: vision-transport
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vision
  action: ALLOW
  rules: []
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: scribe-transport
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: scribe
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/api-waypoint
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-requests
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: api-waypoint
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/public-gateway-istio
    to:
    - operation:
        methods: [GET, POST]
        paths:
        - /graphql
        - /pengolo/files/*
        - /provisioning/organizations
        ports:
        - '8081'
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/scribe
    to:
    - operation:
        methods:
        - POST
        paths:
        - /internal/chat/tools
        - /internal/chat/events
        ports:
        - '8081'
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/auth
    to:
    - operation:
        methods: [POST]
        paths: [/internal/auth/graphql]
        ports: ['8081']
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/gateway
    to:
    - operation:
        methods:
        - POST
        paths:
        - /galadril.registry.v1.Registry/ValidateTenants
        - /galadril.registry.v1.Registry/GetTenant
        - /galadril.registry.v1.Registry/PutTenant
        - /galadril.registry.v1.Registry/DeleteTenant
        - /galadril.registry.v1.Registry/PutPipeline
        - /galadril.registry.v1.Registry/GetPipeline
        - /galadril.registry.v1.Registry/ListPipelines
        - /galadril.registry.v1.Registry/PublishPipeline
        - /galadril.registry.v1.Registry/DeletePipeline
        - /galadril.registry.v1.Registry/ListPublishedPipelines
        - /galadril.registry.v1.Registry/GetRuntimePipeline
        - /galadril.registry.v1.Registry/PutOntology
        - /galadril.registry.v1.Registry/GetOntology
        - /galadril.registry.v1.Registry/PublishOntology
        - /galadril.registry.v1.Registry/RetireOntology
        - /galadril.registry.v1.Registry/ListOntologies
        - /galadril.registry.v1.Registry/PutBinding
        - /galadril.registry.v1.Registry/ListBindings
        - /galadril.registry.v1.Registry/GetOntologySlice
        - /galadril.registry.v1.Registry/DiffOntology
        - /galadril.registry.v1.Registry/MergeOntology
        - /grpc.health.v1.Health/Check
        ports:
        - '50053'
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/intake
        - cluster.local/ns/galadril/sa/vision
    to:
    - operation:
        methods:
        - POST
        paths:
        - /galadril.registry.v1.Registry/ValidateTenants
        - /galadril.registry.v1.Registry/GetTenant
        - /galadril.registry.v1.Registry/GetRuntimePipeline
        - /galadril.registry.v1.Registry/GetOntologySlice
        - /galadril.registry.v1.Registry/ListPublishedPipelines
        - /grpc.health.v1.Health/Check
        ports:
        - '50053'
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/gateway
    to:
    - operation:
        methods:
        - POST
        paths:
        - /runs
        - /pipeline/validate
        - /openai/accounts
        - /generations
        - /generations/{*}/cancel
        - /generations/{*}/answers
        - /documents/parse
        - /documents/embed
        - /documents/extract
        - /documents/recognize
        - /documents/rank
        ports:
        - '8091'
    - operation:
        methods:
        - GET
        paths:
        - /models
        - /capabilities
        - /pipeline-capabilities
        - /teams
        ports:
        - '8091'
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/vision
    to:
    - operation:
        methods:
        - POST
        paths:
        - /pipeline/route
        ports:
        - '8091'
  - from:
    - source:
        principals:
        - cluster.local/ns/galadril/sa/public-gateway-istio
    to:
    - operation:
        methods: [GET, POST]
        ports: ['3000']
    - operation:
        methods: [GET, POST]
        ports: ['5225']
        paths: [/api/oauth/authorize, /api/oauth/saml, /api/oauth/oidc]
    - operation:
        methods: [GET]
        ports: ['4444']
        paths: [/oauth2/auth, /.well-known/openid-configuration, /.well-known/jwks.json]
  - from:
    - source:
        principals: [cluster.local/ns/galadril/sa/gateway]
    to:
    - operation:
        methods: [GET, POST, PATCH]
        ports: ['5225']
        paths: [/api/v1/sso]
  - from:
    - source:
        principals: [cluster.local/ns/galadril/sa/utils]
    to:
    - operation:
        methods: [POST]
        paths: [/internal/utils/authorize]
        ports: ['8081']
    - operation:
        methods: [POST]
        paths: [/utils/draft]
        ports: ['8091']
  - from:
    - source:
        principals: [cluster.local/ns/galadril/sa/gateway]
    to:
    - operation:
        methods: [POST]
        paths: [/operation]
        ports: ['8095']
