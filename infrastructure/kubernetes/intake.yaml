apiVersion: v1
kind: ServiceAccount
metadata:
  name: intake
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: intake
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intake
    spec:
      serviceAccountName: intake
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
      containers:
      - name: intake
        image: ghcr.io/aeluin-technologies/galadril-intake:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: DEPLOYMENT_ENVIRONMENT
          value: production
        - name: INTAKE_BOOTSTRAP_PATH
          value: /etc/galadril/connectors.yaml
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: connectors
          mountPath: /etc/galadril
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: schemas
          mountPath: /schemas/avro
          readOnly: true
        - name: spicedb-schema
          mountPath: /schemas/spicedb
          readOnly: true
      volumes:
      - name: connectors
        secret:
          secretName: intake-connectors
      - name: tmp
        emptyDir: {}
      - name: schemas
        configMap:
          name: galadril-schemas
      - name: spicedb-schema
        configMap:
          name: galadril-spicedb-schema
