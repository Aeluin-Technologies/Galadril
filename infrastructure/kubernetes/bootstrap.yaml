apiVersion: batch/v1
kind: Job
metadata:
  name: spicedb-schema
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spicedb-schema
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: authzed/zed:v1.2.1@sha256:075810514ce2b5b494240b8015dd1ee686b47c00e238a5925eaf5f5fe3c8d02e
          args: [schema, write, /schema/schema.zed, --endpoint, $(SPICEDB_ENDPOINT), --token, $(SPICEDB_TOKEN), --log-format, json]
          envFrom:
            - secretRef:
                name: spicedb-bootstrap
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: schema
          configMap:
            name: galadril-spicedb-schema
