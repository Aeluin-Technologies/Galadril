receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/redpanda:
    config:
      scrape_configs:
        - job_name: redpanda
          scrape_interval: 15s
          metrics_path: /public_metrics
          static_configs:
            - targets: [redpanda:9644]
  prometheus/spicedb:
    config:
      scrape_configs:
        - job_name: spicedb
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: [spicedb:9090]
  prometheus/postgres:
    config:
      scrape_configs:
        - job_name: postgres
          scrape_interval: 15s
          static_configs:
            - targets: [postgres-exporter:9187]
  prometheus/tempo:
    config:
      scrape_configs:
        - job_name: tempo
          scrape_interval: 15s
          static_configs:
            - targets: [tempo:3200]
              labels:
                service: tempo
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: [otel-collector:8888]
              labels:
                service: otel-collector
  prometheus/ray:
    config:
      scrape_configs:
        - job_name: ray
          scrape_interval: 30s
          static_configs:
            - targets: [api-proxy:18089]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'ray_node_(cpu_count|cpu_utilization|mem_used|mem_total|cgroup_mem_used|cgroup_mem_total|disk_free|disk_usage|disk_io_read_speed|disk_io_write_speed|network_received|network_sent)'
              action: keep
  prometheus/profiler:
    config:
      scrape_configs:
        - job_name: profiler
          scrape_interval: 15s
          static_configs:
            - targets: [profiler:12345]
              labels:
                service: profiler

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # Compose runs one receiving Collector, so every span of a trace reaches this buffer.
  tail_sampling:
    decision_wait: ${env:GALADRIL_TRACE_DECISION_WAIT:-90s}
    num_traces: ${env:GALADRIL_TRACE_BUFFER_TRACES:-4000}
    expected_new_traces_per_sec: ${env:GALADRIL_TRACE_EXPECTED_PER_SECOND:-40}
    maximum_trace_size_bytes: ${env:GALADRIL_TRACE_MAX_BYTES:-65536}
    decision_cache:
      sampled_cache_size: 10000
      non_sampled_cache_size: 40000
    policies:
      - name: canonical-failure
        type: string_attribute
        string_attribute:
          key: galadril.error.code
          values: [ifc_violation, concurrent_conflict, unavailable, deadline_exceeded, invalid_result, internal]
      - name: unclassified-failure
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'status.code == STATUS_CODE_ERROR and attributes["galadril.error.code"] == nil'
      - name: slow-execution
        type: latency
        latency:
          threshold_ms: ${env:GALADRIL_TRACE_SLOW_MS:-5000}
      - name: ordinary
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:GALADRIL_TRACE_SUCCESS_SAMPLE_PERCENT:-2}
  filter/operational_logs:
    error_mode: propagate
    log_conditions:
      - 'IsMatch(log.event_name, "^galadril[.]audit[.]")'
      - 'log.attributes["event.name"] != nil and IsMatch(log.attributes["event.name"], "^galadril[.]audit[.]")'
      - 'log.attributes["event.name"] == "authorization.check"'
      - 'log.event_name == "galadril.gateway.authorization.check" and log.attributes["galadril.authorization.decision"] == "allow"'
      - 'log.severity_number < SEVERITY_NUMBER_WARN and log.attributes["galadril.error.code"] == nil and log.event_name != "galadril.gateway.authorization.check"'
  transform/operational_privacy:
    error_mode: propagate
    trace_statements:
      # Span attributes must be redacted even when the span has no events.
      - context: span
        statements:
          - delete_matching_keys(span.attributes, "^galadril[.]audit[.]")
          - delete_key(span.attributes, "db.query.text")
          - delete_key(span.attributes, "db.statement")
          - delete_key(span.attributes, "url.full")
          - delete_key(span.attributes, "url.query")
          - delete_key(span.attributes, "http.url")
          - delete_matching_keys(span.attributes, "^(http[.](request|response)[.]header[.]|db[.]query[.]parameter[.])")
          - set(span.status.message, "")
      - context: spanevent
        statements:
          - delete_matching_keys(spanevent.attributes, "^(galadril[.]audit[.]|exception[.])")
    metric_statements:
      - delete_matching_keys(datapoint.attributes, "^galadril[.]audit[.]")
    log_statements:
      - delete_matching_keys(log.attributes, "^(galadril[.]audit[.]|exception[.])")
      - 'set(log.attributes["event.name"], log.event_name) where IsMatch(log.event_name, "^galadril[.]")'
      - 'set(log.severity_text, "ERROR") where log.event_name == "galadril.gateway.authorization.check" and log.attributes["galadril.authorization.decision"] == "error"'
      - 'set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.event_name == "galadril.gateway.authorization.check" and log.attributes["galadril.authorization.decision"] == "error"'
      - 'set(log.severity_text, "WARN") where log.event_name == "galadril.gateway.authorization.check" and log.attributes["galadril.authorization.decision"] == "deny"'
      - 'set(log.severity_number, SEVERITY_NUMBER_WARN) where log.event_name == "galadril.gateway.authorization.check" and log.attributes["galadril.authorization.decision"] == "deny"'
  batch:
    timeout: 2s
    send_batch_size: 2048
  resource:
    attributes:
      - key: deployment.environment
        action: insert
        value: development

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    timeout: 3s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: ${env:GALADRIL_TRACE_EXPORT_RETRY_LIMIT:-30s}
    sending_queue:
      queue_size: 128
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/operational_privacy, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [
        otlp,
        prometheus/redpanda,
        prometheus/spicedb,
        prometheus/postgres,
        prometheus/tempo,
        prometheus/collector,
        prometheus/profiler,
        prometheus/ray,
      ]
      processors: [memory_limiter, resource, transform/operational_privacy, batch]
      exporters: [prometheusremotewrite/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/operational_logs, transform/operational_privacy, batch]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
