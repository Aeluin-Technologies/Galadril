receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/redpanda:
    config:
      scrape_configs:
        - job_name: redpanda
          scrape_interval: 15s
          metrics_path: /public_metrics
          static_configs:
            - targets: [redpanda:9644]
  prometheus/spicedb:
    config:
      scrape_configs:
        - job_name: spicedb
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: [spicedb:9090]
  prometheus/postgres:
    config:
      scrape_configs:
        - job_name: postgres
          scrape_interval: 15s
          static_configs:
            - targets: [postgres-exporter:9187]
  prometheus/tempo:
    config:
      scrape_configs:
        - job_name: tempo
          scrape_interval: 15s
          static_configs:
            - targets: [tempo:3200]
              labels:
                service: tempo
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: [otel-collector:8888]
              labels:
                service: otel-collector
  prometheus/profiler:
    config:
      scrape_configs:
        - job_name: profiler
          scrape_interval: 15s
          static_configs:
            - targets: [profiler:12345]
              labels:
                service: profiler

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  filter/health_checks:
    error_mode: ignore
    trace_conditions:
      - 'span.attributes["galadril.health_check"] == true and span.status.code != STATUS_CODE_ERROR'
  filter/authorization_allows:
    error_mode: ignore
    log_conditions:
      - 'resource.attributes["service.name"] == "galadril-gateway" and log.attributes["event.name"] == "authorization.check" and log.attributes["decision"] == "allow"'
  transform/authorization_denials:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'set(log.severity_text, "WARN") where resource.attributes["service.name"] == "galadril-gateway" and log.attributes["event.name"] == "authorization.check" and log.attributes["decision"] == "deny"'
          - 'set(log.severity_number, SEVERITY_NUMBER_WARN) where resource.attributes["service.name"] == "galadril-gateway" and log.attributes["event.name"] == "authorization.check" and log.attributes["decision"] == "deny"'
  batch:
    timeout: 2s
    send_batch_size: 2048
  resource:
    attributes:
      - key: deployment.environment
        action: insert
        value: development

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/health_checks, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [
        otlp,
        prometheus/redpanda,
        prometheus/spicedb,
        prometheus/postgres,
        prometheus/tempo,
        prometheus/collector,
        prometheus/profiler,
      ]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/authorization_denials, filter/authorization_allows, batch]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
