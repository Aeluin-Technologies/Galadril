global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889", "otel-collector:8888"]

  - job_name: faststream
    metrics_path: /metrics
    static_configs:
      - targets:
          - vision-ingress:8000
          - vision-cpu:8000
          - vision-gpu:8000
          - vision-causal:8000

  - job_name: ray
    static_configs:
      - targets: ["ray-head:8080"]
