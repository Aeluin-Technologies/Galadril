minimumReleaseAge: 4320

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  protobufjs: true
  unrs-resolver: true
  vue-demi: true

packages:
  - "dashboard"
  - "ui"

nodeLinker: hoisted

packageExtensions:
  "@nuxtjs/i18n@10.6.0":
    dependencies:
      "@intlify/core-base": "^11.4.16"
  nuxt-define@1.0.0:
    dependencies:
      "@nuxt/kit": "^4.6.2"

overrides:
  brace-expansion@^5.0.0: ^5.0.12

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc

patchedDependencies:
  "@nuxtjs/i18n@10.6.0": patches/@nuxtjs__i18n@10.6.0.patch
