allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  protobufjs: true
  unrs-resolver: true
  vue-demi: true

packages:
  - "."

nodeLinker: hoisted

overrides:
  brace-expansion@^5.0.0: ^5.0.12

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
