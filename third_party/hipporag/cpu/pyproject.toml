# Keep the graph engine's CPU wheel separate from Vision's GPU dependency graph.
[project]
name = "galadril"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = ["torch==2.14.1", "torchvision==0.29.1"]

[tool.uv.workspace]
members = []

[tool.uv]
constraint-dependencies = ["filelock==3.32.7", "fsspec==2026.9.0", "markupsafe==3.0.4", "networkx==3.7", "numpy==2.5.4", "pillow==13.0.0"]
environments = ["sys_platform == 'linux'"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
