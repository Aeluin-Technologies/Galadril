[project]
name = "galadril-document-memory"
version = "0.1.0"
description = "Pinned official HippoRAG engine with Galadril local inference adapters."
requires-python = ">=3.13"
dependencies = [
    "igraph==0.11.8",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "pyarrow>=20,<24",
    "filelock>=3.18,<4",
    "torch>=2.11",
    "tqdm>=4.67,<5",
    "openai>=3.3.1,<4",
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upstream/hipporag"]
