[project]
name = "vision"
version = "0.1.0"
description = "Galadril Vision, AI pipeline."
readme = "README.md"
requires-python = "==3.13.*"

dependencies = [
    "aioboto3>=15.5.0",
    "galadril-inference",
    "galadril-ontology",
    "galadril-pipeline",
    "ray[client]>=2.52",
    "confluent-kafka[avro,json,schema-registry]>=2.14",
    "faststream[confluent]>=0.7.2,<0.8",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.0",
    "orjson>=3.10",
    "psycopg-pool>=3.3",
    "mypy-boto3-s3>=1.42",
    "authzed>=1.25.0,<2",
    "protobuf<7",
    "grpcio<1.82",
    "grpcio-health-checking<1.82",
    "geoalchemy2>=0.20.0",
    "greenlet>=3.5.0",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2",
    "opentelemetry-instrumentation-logging>=0.65b0,<0.66",
    "opentelemetry-instrumentation-system-metrics>=0.65b0,<0.66",
    "opentelemetry-sdk>=1.44.0,<2",
    "moka-py>=0.3.0",
    "opencv-python-headless>=4.0",
    "uvloop>=0.22.1",
    "licorne>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.10",
    "testcontainers[kafka,postgres]>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0",
]

[tool.uv.sources]
galadril-inference = { workspace = true }
galadril-ontology = { workspace = true }
galadril-pipeline = { workspace = true }
licorne = { git = "https://github.com/Aeluin-Technologies/LI-ESKG.git", subdirectory = "python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galadril_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["galadril_vision"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
