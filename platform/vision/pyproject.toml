[project]
name = "vision"
version = "0.1.0"
description = "Galadril Vision, AI pipeline."
readme = "README.md"
requires-python = "==3.13.*"

dependencies = [
    "aioboto3>=15.5.0",
    "galadril-inference",
    "galadril-pipeline",
    "daft[iceberg,ray]>=0.7.3",
    "ray[default]>=2.52",
    "confluent-kafka[avro,json,schema-registry]>=2.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.0",
    "orjson>=3.10",
    "psycopg-pool>=3.3",
    "mypy-boto3-s3>=1.42",
    "authzed",
    "protobuf<7",
    "grpcio<1.82",
    "grpcio-health-checking<1.82",
    "geoalchemy2>=0.20.0",
    "greenlet>=3.5.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "dagster>=1.13",
    "dagster-webserver>=1.13",
]

[project.optional-dependencies]
dev = [
    "testcontainers[kafka,postgres]>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0",
    "opencv-python-headless>=4.0",
]

[tool.uv.sources]
galadril-inference = { workspace = true }
galadril-pipeline = { workspace = true }
authzed = { git = "https://github.com/authzed/authzed-py.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galadril_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
