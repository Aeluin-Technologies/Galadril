[project]
name = "galadril-mcp-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28.1", "mcp>=1.30,<2", "pyjwt[crypto]>=2.12,<3", "pydantic>=2.13.4", "opentelemetry-api>=1.44.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galadril_mcp_core"]
