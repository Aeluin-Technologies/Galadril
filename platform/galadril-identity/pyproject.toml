[project]
name = "galadril-identity"
version = "0.1.0"
description = "Identity merger."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "numpy>=2.4",
    "orjson>=3.11",
    "networkx>=3.6",
    "scikit-learn>=1.6",
    "lightgbm>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galadril_identity"]

[tool.uv]
managed = true
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
