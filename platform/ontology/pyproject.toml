[project]
name = "galadril-ontology"
version = "0.1.0"
description = "Multi-tenant ontology versioning primitives for Galadril."
requires-python = "==3.13.*"
dependencies = [
    "orjson>=3.10",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galadril_ontology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["galadril_ontology"]

[tool.coverage.report]
fail_under = 100
show_missing = true
