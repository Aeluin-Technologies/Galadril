file_format: definition/1
groups:
  - id: galadril.resource
    type: attribute_group
    brief: Identifies the service producing an operational signal.
    stability: stable
    attributes:
      - {ref: service.name, requirement_level: required}
      - {ref: service.version, requirement_level: recommended}
      - {ref: service.instance.id, requirement_level: recommended}
      - {ref: deployment.environment.name, requirement_level: recommended}
      - {ref: telemetry.sdk.language, requirement_level: recommended}
