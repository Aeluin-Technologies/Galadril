file_format: definition/1
groups:
  - id: registry.galadril.studio
    type: attribute_group
    brief: Canonical Galadril studio attributes.
    stability: stable
    attributes:
      - id: galadril.auth.operation
        type:
          members:
            - {id: session, stability: stable, brief: Read session state.}
            - {id: mfa_options, stability: stable, value: mfa/options, brief: Fetch challenge options.}
            - {id: mfa_verify, stability: stable, value: mfa/verify, brief: Verify a challenge.}
            - {id: local_flow, stability: stable, value: local/flow, brief: Start the local flow.}
            - {id: local_callback, stability: stable, value: local/callback, brief: Finish the local flow.}
            - {id: logout, stability: stable, brief: End a session.}
            - {id: start, stability: stable, brief: Begin sign-in.}
            - {id: login, stability: stable, brief: Submit sign-in.}
            - {id: polis_callback, stability: stable, value: polis/callback, brief: Handle the Polis callback.}
            - {id: consent, stability: stable, brief: Record consent.}
            - {id: callback, stability: stable, brief: Handle the sign-in callback.}
            - {id: mcp_continue, stability: stable, value: mcp/continue, brief: Continue MCP sign-in.}
            - {id: refresh, stability: stable, brief: Extend session lifetime.}
            - {id: step_up, stability: stable, value: step-up, brief: Start step-up authentication.}
            - {id: unknown, stability: stable, brief: Request outside the known authentication routes.}
        brief: Fixed authentication route family.
        stability: stable
        annotations: {galadril.cardinality: bounded, galadril.classification: operational}
      - id: galadril.auth.outcome
        type:
          members:
            - {id: success, stability: stable, brief: The authentication route completed.}
            - {id: denied, stability: stable, brief: The authentication route returned a failure.}
        brief: Terminal result of the authentication attempt.
        stability: stable
        annotations: {galadril.cardinality: bounded, galadril.classification: operational}
  - id: metric.galadril.auth.attempts
    type: metric
    metric_name: galadril.auth.attempts
    instrument: counter
    unit: "{attempt}"
    brief: Authentication attempts across Studio routes.
    stability: stable
    attributes:
      - {ref: galadril.auth.operation, requirement_level: required}
      - {ref: galadril.auth.outcome, requirement_level: required}
